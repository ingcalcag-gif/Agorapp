# Prove automatiche (voce T-005 del piano di adeguamento): a ogni invio su qualunque ramo.
# Usano soltanto il codice del repository e dati inventati; nessuna prova contatta servizi esterni.
name: Prove
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    # Con 55 prove il lavoro dura 22-28 minuti sulle macchine di GitHub (27/11/2026): limite a 45 per i blocchi che seguono.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strumento del montaggio (terser, solo per compattare, T-060)
        working-directory: sorgenti
        run: npm ci --no-audit --no-fund
      - name: Strumenti delle prove (Playwright e axe-core, solo per le prove)
        working-directory: prove
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Prove
        run: node prove/esegui.js --tutte --dettagli
