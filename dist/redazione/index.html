<template id="leg-privacy"><span class="legal-badge">✓ Conforme GDPR · v1.2 · Marzo 2026</span>
        <h3>1. Titolare del trattamento</h3>
        <p><strong>Agorapp</strong>, progetto di <strong>Lorenzo Calcagno</strong>, Torino<br>
        Contatto: <span class="segnaposto">[casella di contatto]</span></p>
        <h3>2. Quali dati trattiamo e perché</h3>
        <p>Agorapp è una mappa interattiva degli eventi urbani di Torino. <strong>Non raccoglie dati personali degli utenti che consultano la mappa</strong>: non ci sono account, non ci sono cookie di profilazione, non ci sono sistemi di tracciamento.</p>
        <p>Gli unici dati trattati riguardano gli <strong>organizzatori di eventi</strong> che richiedono la pubblicazione: titolo, luogo, orario, descrizione, eventualmente un nome artistico o il nome dell'organizzazione.</p>
        <p>Trattiamo inoltre informazioni su eventi provenienti da <strong>fonti pubblicamente accessibili</strong> (siti web, pagine social pubbliche), quando l'organizzatore ha scelto consapevolmente di renderle pubbliche.</p>
        <h3>3. Base giuridica del trattamento</h3>
        <ul>
          <li><strong>Consenso esplicito (art. 6(1)(a) GDPR)</strong> — per gli organizzatori che ci contattano direttamente. Il consenso è documentato e conservato.</li>
          <li><strong>Legittimo interesse (art. 6(1)(f) GDPR)</strong> — per eventi da fonti pubbliche. Il bilanciamento è documentato internamente. Puoi opporti in qualsiasi momento scrivendo a <span class="segnaposto">[casella di contatto]</span>.</li>
        </ul>
        <h3>4. Per quanto tempo conserviamo i dati</h3>
        <p>I dati di ogni evento vengono <strong>eliminati automaticamente 3 ore dopo la scadenza dell'evento</strong>. Non esiste un archivio storico. Le prove del consenso sono conservate per un massimo di 3 anni dalla data dell'evento.</p>
        <h3>5. Chi può vedere i dati</h3>
        <p>Le informazioni degli eventi sono visibili a chiunque visiti Agorapp. <strong>Nessun dato viene ceduto, venduto o comunicato a terzi</strong> per finalità commerciali o di marketing.</p>
        <h3>6. Trasferimento dati fuori dall'UE</h3>
        <p>Agorapp non trasferisce dati personali verso paesi extra-UE. La visualizzazione della mappa utilizza il servizio <strong>CartoDB/Carto</strong> per le immagini geografiche. Tale servizio può registrare l'indirizzo IP dell'utente secondo la propria privacy policy disponibile su <a href="https://carto.com/privacy" target="_blank" rel="noopener">carto.com/privacy</a>. Carto Inc. opera sulla base di Clausole Contrattuali Standard approvate dalla Commissione europea.</p>
        <h3>7. I tuoi diritti (artt. 15–21 GDPR)</h3>
        <p>Puoi esercitare in qualsiasi momento i diritti di accesso, rettifica, cancellazione, limitazione, opposizione e portabilità. Le richieste di rimozione di un evento vengono eseguite entro <strong>48 ore</strong>. Scrivi a <span class="segnaposto">[casella di contatto]</span> — risponderemo entro 30 giorni.</p>
        <h3>8. Reclamo al Garante</h3>
        <p>Puoi proporre reclamo al Garante per la protezione dei dati personali: <a href="https://www.garanteprivacy.it" target="_blank" rel="noopener">garanteprivacy.it</a> · Piazza Venezia 11, 00187 Roma</p>
        <h3>9. Decisioni automatizzate</h3>
        <p>Agorapp non effettua profilazione né decisioni automatizzate.</p></template>
<template id="leg-storage"><span class="legal-badge">Solo sul tuo dispositivo · Nessun server</span>
        <h3>Cosa viene salvato sul tuo dispositivo</h3>
        <p>Agorapp utilizza esclusivamente strumenti di archiviazione tecnica locale. <strong>Nessun dato viene mai trasmesso a server esterni</strong> da questi strumenti.</p>
        <h3>localStorage</h3>
        <p>Conserva sul tuo dispositivo:</p>
        <ul>
          <li>Gli eventi presenti sulla mappa</li>
          <li>Il tema grafico scelto (Chiaro / Scuro)</li>
          <li>Il calendario personale degli eventi salvati</li>
          <li>Lo stato dei filtri per strato</li>
        </ul>
        <p>I dati in localStorage rimangono fino a quando non vengono cancellati manualmente o finché gli eventi non scadono automaticamente.</p>
        <h3>Base normativa</h3>
        <p>Questi strumenti sono assimilabili ai <strong>cookie tecnici</strong> ai sensi del Provvedimento Garante del 10 giugno 2021 e sono <strong>esenti dall'obbligo di consenso preventivo</strong>.</p>
        <p>Non vengono utilizzati cookie di profilazione, cookie analitici né strumenti di tracciamento di terze parti.</p>
        <h3>Servizi cartografici di terze parti</h3>
        <p>La visualizzazione della mappa utilizza due servizi esterni che ricevono l'indirizzo IP dell'utente ad ogni caricamento delle immagini geografiche:</p>
        <ul>
          <li><strong>CartoDB/Carto</strong> — fornisce le immagini della mappa. Privacy policy: <a href="https://carto.com/privacy" target="_blank" rel="noopener">carto.com/privacy</a>. Opera su base Clausole Contrattuali Standard UE.</li>
          <li><strong>OpenStreetMap</strong> — base cartografica open source. Privacy policy: <a href="https://osmfoundation.org/wiki/Privacy_Policy" target="_blank" rel="noopener">osmfoundation.org/wiki/Privacy_Policy</a>.</li>
        </ul>
        <p>Agorapp non ha accesso a questi dati e non li controlla.</p>
        <h3>Come cancellare i dati locali</h3>
        <p>Puoi cancellare tutti i dati locali di Agorapp in qualsiasi momento dalle impostazioni del tuo browser (Impostazioni → Privacy → Cancella dati di navigazione → Dati siti web).</p></template>
