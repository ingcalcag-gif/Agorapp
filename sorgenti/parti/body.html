<div class="app" id="app" data-sez="mappa">
  <header class="top">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      <button class="marchio" data-az="home" id="btnHome" aria-label="Agorapp"><span class="quad"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 14V7M8 7C8 4.5 6 3 3.5 3 3.5 5.5 5.5 7 8 7ZM8 9c0-2.5 2-4 4.5-4 0 2.5-2 4-4.5 4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nome">Agorapp</span></button>
      <button class="badge-admin" id="badgeAdmin" data-az="admin" hidden>Admin</button>
    </div>
    <div class="top-dx">
      <button class="citta" data-az="citta" id="btnCitta"><span id="cittaLbl">Torino</span></button>
      <button class="ingr" data-az="impostazioni" id="btnImpo"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="13" cy="6" r="2" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="14" r="2" stroke="currentColor" stroke-width="1.7"/></svg></button>
    </div>
  </header>

  <div id="scena">
  <div id="area">
    <div id="map"></div>

    <div class="sopra" id="sopra">
      <div class="riga-cerca">
        <button class="cerca vetro" data-az="cerca" id="btnCerca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="cercaLbl"></span></button>
        <button class="btn-strati btn-elenco vetro" data-az="elenco" id="btnElenco"></button>
      </div>
      <div class="riga-chips"><div id="chipCal"></div><div class="chips" id="chips" role="group"></div><button class="chips-avanti vetro" id="chipsAvanti" data-az="chips-avanti" hidden aria-label="Altri"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 3 9.5 7l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>

    <div class="lato" id="lato">
      <div class="zoom vetro" role="group" id="zoomGr"><button data-az="zoom-piu" id="zPiu"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span class="zoom-sep"></span><button data-az="zoom-meno" id="zMeno"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 9h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <button class="tondo piccolo vetro" data-az="pieno" id="btnPieno" aria-pressed="false"></button>
      <button class="tondo piccolo vetro" data-az="posizione" id="btnGps"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="10" r="2.2" fill="currentColor"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button class="tondo vetro cal-grande" data-az="calendario" id="btnCal"></button>
      <button class="fab" data-az="nuovo" id="btnNuovo"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Off-Grid</button>
    </div>
    <div class="tipi-mappa" id="tipiMappa" role="group"></div>
    <div class="attrib vetro" id="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a></div>

    <button class="peek vetro" id="peek" data-az="strati"></button>
    <div class="avviso-strati vetro" id="avvisoStrati" role="note" hidden></div>
  </div>
    <div id="pagina-progetti" class="pagina sez-progetti" hidden>
      <div class="anteprima" role="note"><b data-t="Anteprima">Anteprima</b><span data-t="Iscrizioni non ancora aperte: i contenuti sono d’esempio.">Iscrizioni non ancora aperte: i contenuti sono d’esempio.</span><button data-az="anteprima" data-t="Cosa vuol dire">Cosa vuol dire</button></div>
      <main id="pag-progetti"></main>
    </div>
    <div id="pagina-agora" class="pagina sez-agora c-abitativo" hidden>
      <div class="anteprima" role="note"><b data-t="Anteprima">Anteprima</b><span data-t="Iscrizioni non ancora aperte: i contenuti sono d’esempio.">Iscrizioni non ancora aperte: i contenuti sono d’esempio.</span><button data-az="anteprima" data-t="Cosa vuol dire">Cosa vuol dire</button></div>
      <main id="pag-agora"></main>
    </div>
    <div id="pagina-temi" class="pagina sez-temi" hidden></div>
    <div id="pagina-misure" class="pagina sez-misure" hidden></div>
    <div id="foglio-slot"></div>
    <div id="posa-slot"></div>
    <div id="guida-slot"></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <nav class="bassa" id="navBassa">
    <button data-sez="mappa" aria-current="page"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5 6.5 3l5 1.5L16 3v10.5L11.5 15l-5-1.5L2 15V4.5ZM6.5 3v10.5M11.5 4.5V15" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-t="Mappa">Mappa</span></button>
    <button data-sez="progetti"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m9 2 7 4-7 4-7-4 7-4ZM2 9.5l7 4 7-4M2 12.5l7 4 7-4" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-t="Progetti">Progetti</span></button>
    <button data-sez="agora"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 7 9 3l7 4M3.5 7.5v6M7 7.5v6M11 7.5v6M14.5 7.5v6M2 15h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="Agorà">Agorà</span></button>
    <button data-sez="temi"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M7 2 5.5 16M12.5 2 11 16M3 6.5h13M2 11.5h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-t="Temi">Temi</span></button>
  </nav>
  <input type="file" id="fileImporta" class="file-nascosto" accept=".xlsx,.xls,.ods,.csv,.json" tabindex="-1" aria-hidden="true">
</div>
