<!DOCTYPE html>
<!-- Restyling 4 — 2026-10-08 — ramo restyling-app. Mappa, Calendario, Off-Grid, Strati, Temi; Progetti e Agorà in anteprima (5 lingue). 4 ottobre: «Il tuo calendario» fermo, tasto Calendario grande, trattino che allarga i pannelli, Strati trasparenti, PDF da condividere, demo per tutti, import/export Excel per l'admin, primo accesso chiaro. 4 ottobre sera: Ordine delle Fate (funzione nascosta). 6 ottobre: Misure nell'admin (tranche 1) e pulsanti volontari «Mi interessa» (tranche 2). OG 1.7 archiviata in versioni/og17 -->
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<title>Agorapp — Torino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Stesso sistema dei mockup Agorà e Progetti: carta, DM Serif + DM Sans, verde solo per le azioni,
   colore e icona colorata per ogni oggetto. Tutto ciò che sta sopra la mappa è vetro in penombra.
   Grammatica dei segnaposto: la FORMA dice che cos'è, il COLORE dice di che strato o di quale oggetto è.
   v2: tutte le funzioni dell'app online (OG 1.7) riportate in questo stile. */
:root{
  --fondo:#F5F0E8; --superficie:#FFFDF8; --incassata:#F0EBE0; --linea:rgba(60,50,30,.14); --linea-forte:rgba(60,50,30,.28);
  --testo:#1C1712; --testo-2:#5C5246; --verde:#2D5A3D; --verde-premuto:#1F4029; --su-verde:#FDFAF4; --verde-tenue:#E8F0EB;
  --rosso:#B3261E; --rosso-tenue:#FBE9E7;
  --mappa-terra:#ECE6D9; --mappa-strada:#FBF8F1; --mappa-edificio:#E2DBCC; --mappa-acqua:#C9DCE4; --mappa-parco:#D2E2C8; --mappa-collina:#DCE6CF;
  --ombra-card:0 2px 10px -6px rgba(60,40,20,.22); --ombra-vetro:0 6px 24px -10px rgba(40,30,15,.35); --ombra-pin:0 2px 6px rgba(40,30,15,.30);
  --serif:"DM Serif Display",Georgia,serif; --sans:"DM Sans",system-ui,sans-serif;
  --clay:#C8743E; --clay-ink:#A85C2C; --clay-tenue:#F7E6D6; --clay-bordo:#E9C3A3;
  --ic:#B03A2E; --it:#FDECEA; --ib:#F2B8B0;
  --carta:#FFFFFF; --carta-testo:#1C1712; --carta-2:#5C5246; --carta-linea:rgba(60,50,30,.18);
  --vetro:color-mix(in srgb,var(--superficie) 70%,transparent);
  --vetro-leggero:color-mix(in srgb,var(--superficie) 58%,transparent);
  --vetro-forte:color-mix(in srgb,var(--superficie) 90%,transparent);
  --pin-fondo:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#16130F; --superficie:#211D18; --incassata:#2B2620; --linea:rgba(242,235,224,.14); --linea-forte:rgba(242,235,224,.30);
    --testo:#F2EBE0; --testo-2:#B5A998; --verde:#86B795; --verde-premuto:#A3CDB0; --su-verde:#12201A; --verde-tenue:#1F3326;
    --rosso:#F2B8B5; --rosso-tenue:#3A1F1C;
    --mappa-terra:#1C1915; --mappa-strada:#332D25; --mappa-edificio:#26221C; --mappa-acqua:#1D2E36; --mappa-parco:#1F2C1E; --mappa-collina:#1E261B;
    --ombra-card:0 2px 10px -6px rgba(0,0,0,.6); --ombra-vetro:0 6px 24px -10px rgba(0,0,0,.7); --ombra-pin:0 2px 6px rgba(0,0,0,.6);
    --clay:#E0A070; --clay-ink:#E0A070; --clay-tenue:#3A2A1C; --clay-bordo:#7A5232;
    --ic:#F1948A; --it:#3A1F1B; --ib:#7A3A32; --pin-fondo:#FFFDF8; color-scheme:dark}
}
:root[data-theme="dark"]{
  --fondo:#16130F; --superficie:#211D18; --incassata:#2B2620; --linea:rgba(242,235,224,.14); --linea-forte:rgba(242,235,224,.30);
  --testo:#F2EBE0; --testo-2:#B5A998; --verde:#86B795; --verde-premuto:#A3CDB0; --su-verde:#12201A; --verde-tenue:#1F3326;
  --rosso:#F2B8B5; --rosso-tenue:#3A1F1C;
  --mappa-terra:#1C1915; --mappa-strada:#332D25; --mappa-edificio:#26221C; --mappa-acqua:#1D2E36; --mappa-parco:#1F2C1E; --mappa-collina:#1E261B;
  --ombra-card:0 2px 10px -6px rgba(0,0,0,.6); --ombra-vetro:0 6px 24px -10px rgba(0,0,0,.7); --ombra-pin:0 2px 6px rgba(0,0,0,.6);
  --clay:#E0A070; --clay-ink:#E0A070; --clay-tenue:#3A2A1C; --clay-bordo:#7A5232;
  --ic:#F1948A; --it:#3A1F1B; --ib:#7A3A32; --pin-fondo:#FFFDF8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--testo);font-family:var(--sans);font-size:14px;line-height:20px;overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400;text-wrap:balance}
h1{font-size:24px;line-height:28px}
h2{font-size:20px;line-height:24px}
/* Pagine delle sezioni (Progetti, Agorà, Temi): scorrono sotto la stessa barra in alto */
.pagina{position:absolute;inset:0;overflow-y:auto;background:var(--fondo);display:flex;flex-direction:column;overscroll-behavior:contain}
.anteprima{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--incassata);border-bottom:1px dashed var(--linea-forte);font-size:12px;line-height:16px;color:var(--testo-2)}
.anteprima b{color:var(--testo);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.anteprima span{flex:1;min-width:0}
.anteprima button{min-height:36px;background:none;border:0;padding:0 2px;color:var(--verde);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.pag-semplice{padding:16px 16px 28px;display:flex;flex-direction:column;gap:20px}
.tema-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sez-progetti{--ic:#A85C2C;--pin:#C8743E;--it:#F7E6D6;--ib:#E9C3A3;--su-ic:#FFFDF8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sez-progetti{--ic:#E0A070;--pin:#E0A070;--it:#3A2A1C;--ib:#7A5232;--su-ic:#1E150D}}
:root[data-theme="dark"] .sez-progetti{--ic:#E0A070;--pin:#E0A070;--it:#3A2A1C;--ib:#7A5232;--su-ic:#1E150D}
h3{font-size:18px;line-height:22px}
p{margin:0}
.meta{font-size:12px;line-height:16px;color:var(--testo-2)}
.tipo{font-size:12px;line-height:16px;font-weight:600;color:var(--testo-2);letter-spacing:.04em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}

/* ---------- Telaio ---------- */
.app{height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--fondo);position:relative;overflow:hidden}
.top{flex-shrink:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 12px;background:var(--superficie);border-bottom:1px solid var(--linea);z-index:10}
.marchio{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;cursor:pointer}
.quad{width:30px;height:30px;border-radius:8px;background:var(--verde);color:var(--su-verde);display:flex;align-items:center;justify-content:center}
.nome{font-family:var(--serif);font-size:20px;line-height:24px}
.badge-admin{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--su-verde);background:var(--testo);border-radius:999px;padding:2px 8px;border:0;cursor:pointer;min-height:24px}
.top-dx{display:flex;align-items:center;gap:2px}
.citta{min-height:44px;background:none;border:0;padding:0 4px;display:flex;align-items:center;cursor:pointer}
.citta span{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--testo-2);border:1px solid var(--linea-forte);border-radius:999px;padding:4px 8px 4px 10px}
.ingr{width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--testo-2)}
nav.bassa{flex-shrink:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--superficie);border-top:1px solid var(--linea);z-index:10}
nav.bassa button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;line-height:16px;color:var(--testo-2);background:none;border:0;cursor:pointer}
nav.bassa button[aria-current]{color:var(--verde);font-weight:600}

/* ---------- Mappa ---------- */
#scena{flex:1;position:relative;overflow:hidden;overflow:clip}
#area{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--mappa-terra);touch-action:none;-webkit-user-select:none;user-select:none}
.pressione{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--verde);opacity:.0;animation:preme .6s linear forwards;pointer-events:none}
@keyframes preme{from{transform:scale(.4);opacity:.9}to{transform:scale(1);opacity:.25}}

/* Segnaposto */
.pin{position:relative;padding:0;border:0;background:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pin .f{position:relative;display:flex;align-items:center;justify-content:center;box-shadow:var(--ombra-pin);transition:transform .15s}
.pin.ev .f{width:32px;height:32px;border-radius:50%;background:var(--pin-fondo);border:2.5px solid var(--pc)}
.pin.ev .f svg{width:26px;height:26px}
.pin.pr .f{width:34px;height:34px;border-radius:50%;background:var(--pin-fondo);border:2.5px solid var(--clay);box-shadow:inset 0 0 0 2px var(--pin-fondo),inset 0 0 0 3.5px var(--clay),var(--ombra-pin)}
.pin.pr .f svg{width:20px;height:20px}
.pin.is .f{width:32px;height:32px;border-radius:10px;background:var(--it);border:2.5px solid var(--ic)}
.pin.is .f svg{width:22px;height:22px}
.pin.og .f{width:32px;height:32px;border-radius:50%;background:var(--verde);border:2.5px solid var(--pin-fondo);color:var(--su-verde)}
.pin.ora .f::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid color-mix(in srgb,var(--pc,var(--clay)) 45%,transparent)}
.pin.is.ora .f::after{border-radius:14px}
.pin.finito .f{filter:grayscale(1);opacity:.55}
.pin .salvato,.pin .lucchetto{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--pin-fondo);display:flex;align-items:center;justify-content:center}
.pin .salvato{background:var(--verde);color:var(--su-verde)}
.pin .lucchetto{background:var(--testo);color:var(--fondo);right:auto;left:-5px}
.pin.sel{z-index:5}
.pin.sel .f{transform:scale(1.3)}
.pin.sel::before{content:"";position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:color-mix(in srgb,var(--superficie) 55%,transparent);border:1.5px solid var(--linea-forte)}
.pin.gruppo .f{width:40px;height:40px;border-radius:50%;background:var(--anello);padding:4px}
.pin.gruppo .f span{width:100%;height:100%;border-radius:50%;background:var(--superficie);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;line-height:1;color:var(--testo)}
.tu-qui{position:relative;width:18px;height:18px;border-radius:50%;background:var(--superficie);border:4px solid var(--verde);box-shadow:0 0 0 8px color-mix(in srgb,var(--verde) 18%,transparent)}
.cerca-qui{position:relative;width:26px;height:26px;border-radius:50%;border:2.5px dashed var(--testo);background:color-mix(in srgb,var(--superficie) 40%,transparent)}
/* Giornata sulla mappa: tappe numerate e percorso */
.tappa{position:relative;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:var(--ombra-pin);border:2.5px solid var(--pc);background:var(--pin-fondo);color:#1C1712;cursor:pointer;padding:0}
.tappa.og{background:var(--verde);border-color:var(--pin-fondo);color:var(--su-verde)}
.tratto-lbl{position:relative;font-size:12px;font-weight:700;line-height:16px;white-space:nowrap;border-radius:999px;padding:2px 8px;background:var(--vetro-forte);border:1px solid var(--linea-forte);color:var(--testo)}
.tratto-lbl.stretto{background:var(--clay);color:#fff;border-color:var(--clay)}
.tratto-lbl.sovrapp{background:var(--rosso);color:#fff;border-color:var(--rosso)}

/* ---------- Vetro ---------- */
.vetro{background:var(--vetro);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);border:1px solid color-mix(in srgb,var(--linea-forte) 70%,transparent);box-shadow:var(--ombra-vetro)}
.sopra{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;display:flex;flex-direction:column;gap:8px;z-index:6;pointer-events:none}
.sopra>*{pointer-events:auto}
.riga-cerca{display:flex;gap:8px}
.cerca{flex:1;min-width:0;height:48px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;text-align:left;color:var(--testo-2)}
.cerca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-strati{height:48px;border-radius:14px;display:flex;align-items:center;gap:7px;padding:0 13px;cursor:pointer;font-weight:600}
.btn-strati .conta{font-size:12px;font-weight:600;color:var(--testo-2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
.chips::-webkit-scrollbar{display:none}
.chipt{flex-shrink:0;height:36px;border-radius:999px;padding:0 13px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chipt[aria-pressed="true"]{background:var(--verde);color:var(--su-verde);border-color:var(--verde)}
.chipt .n{font-size:12px;opacity:.8}
.sep{flex-shrink:0;width:1px;margin:6px 2px;background:var(--linea-forte)}
.lato{position:absolute;right:12px;bottom:98px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tondo{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--testo);position:relative}
.tondo.piccolo{width:40px;height:40px}
.app.pieno .top,.app.pieno nav.bassa,.app.pieno #sopra,.app.pieno #tipiMappa,.app.pieno #peek{display:none!important}
.app.pieno .lato>:not(#btnPieno){display:none!important}
.app.pieno .lato{bottom:34px}
.tondo .num{position:absolute;right:-3px;top:-3px;min-width:20px;height:20px;border-radius:999px;background:var(--verde);color:var(--su-verde);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--superficie)}
.fab{height:52px;border-radius:16px;border:0;background:var(--verde);color:var(--su-verde);display:flex;align-items:center;gap:8px;padding:0 16px 0 14px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(30,60,40,.6)}
.fab:hover{background:var(--verde-premuto)}
.tipi-mappa{position:absolute;left:10px;bottom:80px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tipo-p{position:relative;height:32px;border-radius:999px;padding:0 9px 0 3px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px;cursor:pointer;color:var(--testo);
  background:color-mix(in srgb,var(--superficie) 18%,transparent);border:1px solid color-mix(in srgb,var(--linea-forte) 40%,transparent);
  -webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);text-shadow:0 0 2px var(--superficie),0 0 5px var(--superficie),0 0 8px var(--superficie)}
.tipo-p::after{content:"";position:absolute;inset:-5px -2px}
.tipo-p .n{font-size:12px;font-weight:600;color:var(--testo-2)}
.tipo-p[aria-pressed="false"]{opacity:.6}
.tipo-p[aria-pressed="false"] .l{text-decoration:line-through;text-decoration-thickness:1.5px}
.tipo-p[aria-pressed="false"] .forma{filter:grayscale(1)}
.btn-elenco .conta{font-size:12px;font-weight:600;color:var(--testo-2)}
.attrib{position:absolute;right:12px;bottom:72px;z-index:4;font-size:12px;line-height:16px;color:var(--testo-2);padding:2px 8px;border-radius:8px}

.peek{position:absolute;left:0;right:0;bottom:0;z-index:7;border-radius:18px 18px 0 0;border-bottom:0;padding:8px 16px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;min-height:66px}
.peek .maniglia{position:absolute;left:50%;top:6px;margin-left:-20px}
.peek>div{flex:1;min-width:0;padding-top:6px}
.peek strong{font-family:var(--serif);font-weight:400;font-size:18px;line-height:22px;display:block}
.peek .apri-el{font-weight:600;color:var(--verde);display:flex;align-items:center;gap:4px;padding-top:6px;white-space:nowrap}
.maniglia{width:40px;height:4px;border-radius:2px;background:var(--linea-forte);flex-shrink:0}

/* Fogli dal basso */
.foglio{position:absolute;left:0;right:0;bottom:0;z-index:8;border-radius:20px 20px 0 0;border-bottom:0;display:flex;flex-direction:column;max-height:calc(100% - 64px);animation:sale .2s ease-out}
.foglio.leggero{background:var(--vetro-leggero);-webkit-backdrop-filter:blur(5px) saturate(1.2);backdrop-filter:blur(5px) saturate(1.2);max-height:54%}
.foglio.forte{background:var(--vetro-forte)}
.foglio.medio{max-height:64%}
.foglio.alto{max-height:calc(100% - 12px)}
.foglio .testa-f{flex-shrink:0;padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px}
.foglio .testa-f .maniglia{align-self:center}
.foglio .corpo{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
@keyframes sale{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.foglio{animation:none}.pressione{animation:none;opacity:.5}}
.riga-titolo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.riga-titolo>div{min-width:0}
.chiudi{width:44px;height:44px;margin:-8px -10px -8px 0;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--testo-2);flex-shrink:0}
.link{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--verde);background:none;border:0;padding:0;cursor:pointer;font-size:14px;text-align:left}
.nota{font-size:12px;line-height:16px;color:var(--testo-2);text-align:center}

/* Controlli comuni */
.sezione{display:flex;flex-direction:column;gap:8px}
.sez-testa{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.seg{display:flex;border:1px solid var(--linea-forte);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--superficie) 60%,transparent)}
.seg button{flex:1;min-height:44px;border:0;background:none;font-weight:600;font-size:13px;cursor:pointer;color:var(--testo-2);border-right:1px solid var(--linea);padding:0 6px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--verde);color:var(--su-verde)}
.interr{width:40px;height:24px;border-radius:999px;background:var(--linea-forte);position:relative;flex-shrink:0;transition:background .15s}
.interr::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--superficie);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
[aria-pressed="true"] .interr{background:var(--pc,var(--verde))}
[aria-pressed="true"] .interr::after{transform:translateX(16px)}
.riga-int{display:flex;align-items:center;gap:12px;min-height:60px;width:100%;padding:8px 10px;border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 45%,transparent);text-align:left;cursor:pointer}
.riga-int>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.riga-int .t{font-weight:600}
.proposta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--clay-ink);border:1.5px solid var(--clay-bordo);border-radius:999px;padding:1px 8px}

/* Strati */
.tipi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipo-btn{min-height:64px;border-radius:14px;border:1.5px solid var(--linea-forte);background:color-mix(in srgb,var(--superficie) 55%,transparent);display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;cursor:pointer}
.tipo-btn>div{min-width:0;display:flex;flex-direction:column}
.tipo-btn .t{font-weight:600;line-height:18px}
.tipo-btn[aria-pressed="true"]{border-color:var(--verde);background:color-mix(in srgb,var(--superficie) 80%,transparent)}
.tipo-btn[aria-pressed="false"]{opacity:.55}
.tipo-btn[aria-pressed="false"] .t{text-decoration:line-through;text-decoration-thickness:1.5px}
.forma{flex-shrink:0;display:block}
.strati-lista{border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 45%,transparent);display:flex;flex-direction:column}
.strato-r{border-bottom:1px solid var(--linea)}
.strato-r:last-child{border-bottom:0}
.strato-riga{display:flex;align-items:center}
.strato-on{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;padding:6px 4px 6px 10px;background:none;border:0;text-align:left;cursor:pointer}
.strato-on .ico{width:34px;height:34px;flex-shrink:0;display:block}
.strato-on>div{flex:1;min-width:0;display:flex;flex-direction:column}
.strato-on .t{font-weight:600;line-height:18px}
.strato-on[aria-pressed="false"] .ico{filter:grayscale(1);opacity:.5}
.espandi{width:44px;height:56px;border:0;background:none;cursor:pointer;color:var(--testo-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.espandi svg{transition:transform .15s}
.espandi[aria-expanded="true"] svg{transform:rotate(180deg)}
.sub{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px 56px}
.sub button{min-height:36px;border-radius:999px;padding:0 12px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--pc);background:var(--pb);color:var(--pt)}
.sub button[aria-pressed="false"]{background:transparent;color:var(--testo-2);border-color:var(--linea-forte);text-decoration:line-through}
.pillola{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;border-radius:999px;padding:4px 10px 4px 9px;background:var(--pb);color:var(--pt);white-space:nowrap;border:0}
button.pillola{cursor:pointer;min-height:28px}
.pillola.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pp)}
.pillola .mini{width:16px;height:16px;margin:-2px 0 -2px -3px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
:root[data-theme="dark"] .pillola,:root[data-theme="dark"] .sub button[aria-pressed="true"]{background:color-mix(in srgb,var(--pp) 22%,var(--superficie));color:color-mix(in srgb,var(--pp) 55%,#fff)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pillola,:root:not([data-theme="light"]) .sub button[aria-pressed="true"]{background:color-mix(in srgb,var(--pp) 22%,var(--superficie));color:color-mix(in srgb,var(--pp) 55%,#fff)}}

/* Elenchi */
.giorno{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--testo-2);padding:4px 0 0}
.lista{border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 70%,transparent);display:flex;flex-direction:column}
.riga-ev{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 10px;border:0;border-bottom:1px solid var(--linea);background:none;text-align:left;cursor:pointer;width:100%}
.riga-ev:last-child{border-bottom:0}
.riga-ev .ora{width:42px;flex-shrink:0;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.riga-ev .ora.adesso{color:var(--verde)}
.riga-ev .ora.fin{color:var(--testo-2);font-weight:600}
.riga-ev>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.riga-ev .t{font-weight:600;line-height:18px}
.riga-ev .sv{color:var(--verde);flex-shrink:0}

/* Scheda */
.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.01em}
.scheda-testa{display:flex;gap:12px;align-items:flex-start}
.scheda-testa>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.scheda-testa h2{font-size:22px;line-height:27px}
.fatti{display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 70%,transparent)}
.dato{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--linea)}
.dato:last-child{border-bottom:0}
.dato>svg{flex-shrink:0;margin-top:2px;color:var(--testo-2)}
.dato>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.dato .t{font-weight:600}
button.dato{width:100%;background:none;border:0;border-bottom:1px solid var(--linea);text-align:left;cursor:pointer}
button.dato:last-child{border-bottom:0}
.stato{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--verde-tenue);color:var(--verde)}
.stato.grigio{background:var(--incassata);color:var(--testo)}
.desc{line-height:21px}
.desc.chiusa{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tasti{display:flex;gap:8px}
.tasto{flex:1;min-height:48px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;text-align:center;line-height:18px}
.tasto.sec{background:var(--superficie);border:1px solid var(--linea-forte);color:var(--testo)}
.tasto.pri{background:var(--verde);border:0;color:var(--su-verde)}
.tasto.pri:hover{background:var(--verde-premuto)}
.tasto.fatto-ok{background:var(--superficie);border:1.5px solid var(--verde);color:var(--verde)}
.tasto.pericolo{background:var(--superficie);border:1.5px solid var(--rosso);color:var(--rosso)}
.tasto.pericolo-pieno{background:var(--rosso);border:0;color:#fff}
.tasto.pieno{flex:none;width:100%}
.tasto[disabled]{opacity:.5;cursor:default}
.fonte{border-radius:12px;padding:10px 12px;background:var(--incassata);display:flex;flex-direction:column;gap:4px}
.fonte.attenzione{background:var(--rosso-tenue);border:1px solid color-mix(in srgb,var(--rosso) 35%,transparent)}
.richiamo{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;background:var(--it);border:1.5px solid var(--ib)}
.richiamo svg{flex-shrink:0;margin-top:1px}
.pratica-box{display:flex;gap:12px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--clay-tenue);border:1.5px solid var(--clay-bordo)}
.pratica-box>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.og-box{border-radius:12px;padding:10px 12px;background:var(--verde-tenue);display:flex;gap:10px;align-items:flex-start}
.og-box svg{flex-shrink:0;color:var(--verde);margin-top:1px}
.admin-box{border-radius:12px;padding:10px 12px;border:1.5px dashed var(--linea-forte);display:flex;flex-direction:column;gap:8px}

/* Campi */
.campo{min-height:48px;border-radius:12px;border:1.5px solid var(--linea-forte);background:var(--superficie);display:flex;align-items:center;gap:10px;padding:0 12px}
.campo input,.campo select,.campo textarea{flex:1;min-width:0;border:0;background:none;outline:none;min-height:44px;font-size:16px}
.campo textarea{resize:vertical;min-height:64px;padding:10px 0;line-height:20px}
.campo:focus-within{border-color:var(--verde)}
.campo.errore{border-color:var(--rosso)}
.campo.spento{opacity:.5}
.etich{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--testo-2);display:flex;align-items:center;gap:6px}
.etich .fac{font-weight:500;text-transform:none;letter-spacing:0}
.err{font-size:12px;line-height:16px;color:var(--rosso);font-weight:600}
.due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sugg{border-radius:12px;border:1px solid var(--linea-forte);background:var(--superficie);display:flex;flex-direction:column;overflow:hidden}
.sugg button{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border:0;border-bottom:1px solid var(--linea);background:none;text-align:left;cursor:pointer;width:100%}
.sugg button:last-child{border-bottom:0}
.sugg .avv{color:var(--clay-ink)}
.punto-ok{border-radius:12px;padding:10px 12px;background:var(--verde-tenue);display:flex;flex-direction:column;gap:2px}
.punto-ok.avviso{background:var(--clay-tenue)}
.aiuto-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--verde);background:transparent;color:var(--verde);font-weight:700;font-size:14px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.aiuto-btn[aria-expanded="true"]{background:var(--verde);color:var(--su-verde)}
.bolla{background:var(--verde);color:var(--su-verde);border-radius:12px;padding:12px 14px;font-size:13px;line-height:19px;display:flex;flex-direction:column;gap:8px}
.bolla b{font-weight:700}
.chips-in{display:flex;gap:6px;flex-wrap:wrap}
.chip-in{min-height:36px;border-radius:999px;border:1px solid var(--linea-forte);background:var(--superficie);padding:0 12px;font-weight:600;font-size:13px;cursor:pointer}
.chip-in[aria-pressed="true"]{background:var(--verde);color:var(--su-verde);border-color:var(--verde)}
.suggerimenti{display:flex;flex-wrap:wrap;gap:6px}
.suggerimenti button{min-height:36px;border-radius:999px;border:1px solid var(--linea-forte);background:var(--superficie);padding:0 12px;font-size:13px;cursor:pointer}
.luogo-r{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px;border:0;border-bottom:1px solid var(--linea);background:none;width:100%;text-align:left;cursor:pointer}
.luogo-r:last-child{border-bottom:0}
.luogo-r>div{flex:1;min-width:0}
.luogo-r .t{font-weight:600}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .gs{font-size:12px;font-weight:600;color:var(--testo-2);text-align:center;padding-bottom:2px}
.cal button{height:46px;border-radius:10px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 80%,transparent);cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:15px;padding:0}
.cal button small{font-size:12px;font-weight:500;color:var(--testo-2)}
.cal button:disabled{opacity:.3;cursor:default}
.cal button.vuota{visibility:hidden}
.cal button.dentro{background:var(--verde-tenue);border-color:color-mix(in srgb,var(--verde) 40%,transparent)}
.cal button.estremo{background:var(--verde);color:var(--su-verde);border-color:var(--verde)}
.cal button.estremo small{color:var(--su-verde)}
.cal button.oggi{box-shadow:inset 0 0 0 2px var(--verde)}
.cal .punti{display:flex;gap:3px;margin-top:4px;height:6px}
.cal .punto{width:6px;height:6px;border-radius:50%;background:var(--testo-2)}
.cal .punto.og{background:var(--verde)}
.cal .punto.sv{background:transparent;border:1.5px solid var(--verde)}
.cal button.estremo .punto{background:var(--su-verde)}
.giro{display:flex;align-items:center;gap:8px}
.giro .frc{width:44px;height:44px;border-radius:12px;border:1px solid var(--linea-forte);background:var(--superficie);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.giro .frc:disabled{opacity:.35;cursor:default}
.giro>div{flex:1;min-width:0;text-align:center}
.giro strong{font-family:var(--serif);font-weight:400;font-size:19px;line-height:23px;display:block}
.tappa-r{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.tappa-r .n{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2.5px solid var(--pc);background:var(--pin-fondo);color:#1C1712}
.tappa-r .n.og{background:var(--verde);border-color:var(--verde);color:var(--su-verde)}
.tappa-r>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tappa-r .t{font-weight:600}
.tratto-r{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 24px;font-size:12px;line-height:16px;color:var(--testo-2);border-left:2px dashed var(--linea-forte);margin-left:25px}
.tratto-r b{color:var(--testo)}
.avviso-r{font-size:12px;line-height:16px;font-weight:700;border-radius:999px;padding:2px 9px}
.avviso-r.stretto{background:var(--clay-tenue);color:var(--clay-ink)}
.avviso-r.sovrapp{background:var(--rosso-tenue);color:var(--rosso)}
.avviso-r.buco{background:var(--verde-tenue);color:var(--verde)}
.carta{background:var(--carta);color:var(--carta-testo);border:1px solid var(--carta-linea);border-radius:4px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--ombra-card)}
.carta .cm{font-size:12px;line-height:15px;color:var(--carta-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.carta .ct{font-family:var(--serif);font-size:22px;line-height:26px}
.carta .pr{display:grid;grid-template-columns:48px 1fr;gap:8px;border-top:1px solid var(--carta-linea);padding-top:6px;font-size:13px;line-height:18px}
.carta .cr b{font-variant-numeric:tabular-nums}
.carta .cp{font-size:12px;line-height:16px;color:var(--carta-2);border-top:1px solid var(--carta-linea);padding-top:8px}
.casella{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--linea-forte);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--su-verde)}
[aria-pressed="true"]>.casella{background:var(--verde);border-color:var(--verde)}

/* Impostazioni e documenti */
.menu-lista{border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--superficie) 70%,transparent);display:flex;flex-direction:column}
.menu-r{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border:0;border-bottom:1px solid var(--linea);background:none;width:100%;text-align:left;cursor:pointer}
.menu-r:last-child{border-bottom:0}
.menu-r>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.menu-r .t{font-weight:600}
.menu-r.on .t{color:var(--verde)}
.mail{font-weight:600;user-select:all;-webkit-user-select:all}
.legale{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:21px;-webkit-user-select:text;user-select:text}
.legale h3{font-family:var(--sans);font-weight:700;font-size:14px;line-height:20px;margin-top:6px}
.legale p,.legale ul{margin:0}
.legale ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.legale a{color:var(--verde);font-weight:600}
.legale .legal-badge{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--verde-tenue);color:var(--verde)}

/* Posa e guida */
.posa-croce{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.posa-ombra{position:absolute;left:50%;top:50%;z-index:5;width:14px;height:6px;margin:-3px 0 0 -7px;border-radius:50%;background:rgba(0,0,0,.25);pointer-events:none}
.posa-barra{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.guida{position:absolute;left:12px;right:12px;top:108px;z-index:9;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--vetro-forte)}
.guida .passi{display:flex;gap:6px}
.guida .passi span{width:8px;height:8px;border-radius:50%;background:var(--linea-forte)}
.guida .passi span.on{background:var(--verde);width:20px;border-radius:4px}
.tipi-mappa.evidenzia{border-radius:24px}
.evidenzia{box-shadow:0 0 0 3px var(--verde),0 0 0 7px color-mix(in srgb,var(--verde) 25%,transparent)!important}

.toast{position:absolute;left:12px;right:12px;top:12px;z-index:30;background:var(--testo);color:var(--fondo);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--ombra-vetro);display:flex;align-items:center;gap:12px}
.toast span{flex:1}
.toast button{background:none;border:0;color:var(--fondo);font-weight:700;text-decoration:underline;cursor:pointer;min-height:36px}

/* Modalità semplice: testi più grandi, meno comandi */
.app.semplice{font-size:16px;line-height:23px}
.app.semplice .meta{font-size:14px;line-height:19px}
.app.semplice .chipt{font-size:15px;height:42px}
.app.semplice .riga-ev .t,.app.semplice .strato-on .t,.app.semplice .tipo-btn .t{font-size:16px;line-height:21px}
.app.semplice .avanzato{display:none!important}

/* ===== Prestazioni sul telefono: sfocatura solo dove serve, e solo a mappa ferma ===== */
.vetro{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* i controlli piccoli sopra la mappa: fondo semitrasparente, niente sfocatura */
.chipt.vetro,.tondo.vetro,.attrib.vetro,.btn-strati.vetro,.posa-barra.vetro,.t-barra.vetro{-webkit-backdrop-filter:none;backdrop-filter:none}
.chipt.vetro:not([aria-pressed="true"]),.tondo.vetro:not([aria-pressed="true"]),.attrib.vetro,.btn-strati.vetro,.posa-barra.vetro,.t-barra.vetro{background:color-mix(in srgb,var(--superficie) 88%,transparent)}
.tipo-p{-webkit-backdrop-filter:none;backdrop-filter:none}
/* mentre la mappa si muove: nessuna sfocatura, fondo un po' più pieno */
#app.muove .vetro,#app.muove .foglio{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#app.muove .vetro:not([aria-pressed="true"]),#app.muove .foglio{background:color-mix(in srgb,var(--superficie) 92%,transparent)}
/* fuori dalla mappa (Progetti, Agorà, Temi) non c'è niente da sfocare dietro: fondo pieno */
#app:not([data-sez="mappa"]) .vetro,#app:not([data-sez="mappa"]) .foglio{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--superficie)}
.t-testa{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--fondo)}

/* ===== Zoom ===== */
.zoom{display:flex;flex-direction:column;align-items:center;width:40px;border-radius:20px;overflow:hidden;-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--superficie) 88%,transparent)}
.zoom button{width:40px;height:40px;border:0;background:none;color:var(--testo);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.zoom button:disabled{color:var(--testo-2);opacity:.4;cursor:default}
.zoom-sep{width:22px;height:1px;background:var(--linea-forte)}
.app.pieno .lato>.zoom{display:flex!important}
/* i contenitori dei tasti non devono fermare il dito che vuole trascinare la mappa */
.lato,.tipi-mappa{pointer-events:none}
.lato>*,.tipi-mappa>*{pointer-events:auto}
.lato,.tipi-mappa{touch-action:manipulation}
html,body{overscroll-behavior:none}
/* guida: ombra su tutto il resto, il pezzo descritto resta in luce */
.guida-ombra{position:fixed;z-index:60;pointer-events:none;box-shadow:0 0 0 200vmax rgba(10,14,12,.55);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
#guida-slot .guida{z-index:61}
@media (prefers-reduced-motion:reduce){.guida-ombra{transition:none}}


/* ===== App vera: mappa CARTO (MapLibre) al posto della mappa disegnata ===== */
html,body{overscroll-behavior:none}
body{background:var(--fondo)}
.app{padding-bottom:env(safe-area-inset-bottom,0px)}
#map{position:absolute;inset:0;background:var(--mappa-terra)}
#map .maplibregl-canvas{outline:none}
#map .maplibregl-ctrl-bottom-right,#map .maplibregl-ctrl-bottom-left,#map .maplibregl-ctrl-top-right{display:none}
.mk{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mk.alto{z-index:3}
.mk-tu{width:18px;height:18px}
.mk-q{width:26px;height:26px}
.mk-tappa{width:32px;height:32px}
.mk-lbl{pointer-events:none}
.pressione{position:absolute;z-index:5}
.attrib a{color:inherit;text-decoration:none}
.top .nome{white-space:nowrap}
.scheda-img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;display:block;background:var(--incassata)}
.dato a{color:var(--verde);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.riga-ev .meta,.tappa-r .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.campo input[type="date"],.campo input[type="time"],.campo input[type="datetime-local"]{min-width:0}
.sugg .m{font-weight:600}
.sugg .s{font-size:12px;line-height:16px;color:var(--testo-2)}
.sugg .w{font-size:12px;line-height:16px;color:var(--clay-ink)}
.sugg-foot{padding:8px 12px;font-size:12px;color:var(--testo-2);background:var(--incassata)}
.caricamento{font-size:12px;color:var(--testo-2);padding:8px 2px}
.err-box{font-size:12px;line-height:16px;color:var(--rosso);font-weight:600}
.conta-car{font-size:12px;color:var(--testo-2);text-align:right}
.conta-car.ok{color:var(--verde)}
.pagina-vuota{padding:24px 16px;display:flex;flex-direction:column;gap:12px}
.pagina-vuota h1{font-size:24px;line-height:28px}
.toast{top:12px}
.posa-testa{position:absolute;left:12px;right:12px;top:12px;z-index:7;border-radius:14px;padding:10px 14px}
.cal button .oggi-n{color:var(--verde)}
.cal button.passato{opacity:.55}
.carta .pr .nt{display:block;font-size:12px;color:var(--carta-2);white-space:pre-wrap}
.file-nascosto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* due tasti per le serie: grandi, con la riga piccola sotto */
.tasto small{display:block;font-size:12px;font-weight:500;opacity:.85}
.tasto.col{flex-direction:column;gap:0}
/* Lingua araba: la pagina va da destra a sinistra */
[dir="rtl"] .lato{right:auto;left:12px;align-items:flex-start}
[dir="rtl"] .tipi-mappa{left:auto;right:10px;align-items:flex-end}
[dir="rtl"] .attrib{right:auto;left:12px}
[dir="rtl"] .chiudi{margin:-8px 0 -8px -10px}
[dir="rtl"] .sub{padding:0 56px 12px 12px}
[dir="rtl"] .tratto-r{border-left:0;border-right:2px dashed var(--linea-forte);margin-left:0;margin-right:25px;padding:6px 24px 6px 12px}
[dir="rtl"] [aria-pressed="true"] .interr::after{transform:translateX(-16px)}
[dir="rtl"] .interr::after{left:auto;right:3px}
[dir="rtl"] .legale ul{padding-left:0;padding-right:20px}
[dir="rtl"] .freccia-dir{transform:scaleX(-1)}
[dir="rtl"] .riga-ev .ora{text-align:right}
.c-abitativo{--ic:#B03A2E;--it:#FDECEA;--ib:#F2B8B0}
.c-fuorisede{--ic:#2D5A3D;--it:#E8F0EB;--ib:#B9D3C1}
.c-verde{--ic:#1E7A44;--it:#E6F5EC;--ib:#A9DCBC}
.c-autogestiti{--ic:#7D3C98;--it:#F5EEF8;--ib:#D8BFE3}
.c-gentrificazione{--ic:#A84F12;--it:#FEF3E4;--ib:#F3C99A}
.c-uguaglianza{--ic:#1F618D;--it:#EBF5FB;--ib:#AED0E8}
.c-agorapp{--ic:#2D5A3D;--it:#E8F2EB;--ib:#B9D3C1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-abitativo{--ic:#F1948A;--it:#3A1F1B;--ib:#7A3A32}
:root:not([data-theme="light"]) .c-fuorisede,:root:not([data-theme="light"]) .c-agorapp{--ic:#86B795;--it:#1F3326;--ib:#3F6A4C}
:root:not([data-theme="light"]) .c-verde{--ic:#7DCEA0;--it:#1C3325;--ib:#3E6A4E}
:root:not([data-theme="light"]) .c-autogestiti{--ic:#C39BD3;--it:#2E2238;--ib:#5E4470}
:root:not([data-theme="light"]) .c-gentrificazione{--ic:#F0A04B;--it:#3A2A18;--ib:#7A5226}
:root:not([data-theme="light"]) .c-uguaglianza{--ic:#85C1E9;--it:#1B2A38;--ib:#3A5A78}}
:root[data-theme="dark"] .c-abitativo{--ic:#F1948A;--it:#3A1F1B;--ib:#7A3A32}
:root[data-theme="dark"] .c-fuorisede,:root[data-theme="dark"] .c-agorapp{--ic:#86B795;--it:#1F3326;--ib:#3F6A4C}
:root[data-theme="dark"] .c-verde{--ic:#7DCEA0;--it:#1C3325;--ib:#3E6A4E}
:root[data-theme="dark"] .c-autogestiti{--ic:#C39BD3;--it:#2E2238;--ib:#5E4470}
:root[data-theme="dark"] .c-gentrificazione{--ic:#F0A04B;--it:#3A2A18;--ib:#7A5226}
:root[data-theme="dark"] .c-uguaglianza{--ic:#85C1E9;--it:#1B2A38;--ib:#3A5A78}
a.tasto,a.link{text-decoration:none}
a.tasto.sec{color:var(--testo)}
.campo .chiudi{width:36px;height:36px}
.avviso-strati{position:absolute;left:12px;right:12px;top:150px;z-index:7;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--vetro-forte)}
.app.muove .avviso-strati{background:var(--superficie)}
.vuoto-lbl{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px;border-radius:10px;background:var(--vetro-forte);border:1px solid var(--linea);font-size:12px;line-height:15px;color:var(--testo-2);white-space:nowrap;box-shadow:var(--ombra-card)}
.vuoto-lbl b{color:var(--testo);font-weight:700}
.mk-vuoto{width:auto;height:auto}

/* ===== 4 ottobre: «Il tuo calendario» fermo, i tempi scorrono ===== */
.riga-chips{display:flex;align-items:flex-start;gap:6px;margin-right:-12px}
.riga-chips #chipCal{flex-shrink:0}
.riga-chips .chips{flex:1;min-width:0;margin:0;padding:0 12px 4px 0}
[dir="rtl"] .riga-chips{margin-right:0;margin-left:-12px}
[dir="rtl"] .riga-chips .chips{padding:0 0 4px 12px}
.chip-cal:not([aria-pressed="true"]){color:var(--verde);border-color:color-mix(in srgb,var(--verde) 55%,transparent)}
.chip-cal{box-shadow:var(--ombra-vetro)}

/* ===== Il trattino dei pannelli: tocca per allargare a tutto lo spazio, ritocca per tornare giù ===== */
.maniglia-btn{align-self:center;width:72px;height:22px;margin:-6px 0 -4px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.maniglia-btn .maniglia{transition:width .15s,background .15s}
.maniglia-btn:hover .maniglia,.maniglia-btn:focus-visible .maniglia{background:var(--testo-2);width:48px}


/* ===== PDF del calendario: con il segno del condividi ===== */
.tasto-pdf{display:flex;align-items:center;gap:6px}

/* ===== Progetti e Agorà: avviso sulle proposte, invito alla demo ===== */
.avviso-proposte{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--linea-forte);border-radius:14px;padding:10px 12px;font-size:13px;line-height:19px;color:var(--testo-2);background:color-mix(in srgb,var(--superficie) 60%,transparent)}
.avviso-proposte svg{flex-shrink:0;margin-top:2px;color:var(--testo-2)}
.avviso-proposte+.proponi{margin-top:-4px}
.invito-demo{display:flex;flex-direction:column;gap:10px;border:1px solid var(--linea);border-radius:16px;padding:14px;background:var(--superficie)}
.invito-demo .tasto{align-self:flex-start}

/* ===== Import da Excel ===== */
.imp-righe{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:18px;max-height:220px;overflow:auto;border:1px solid var(--linea);border-radius:12px;padding:8px 10px}
.imp-righe .no{color:var(--rosso)}
.colonne{font-size:12px;line-height:18px;color:var(--testo-2)}
.colonne b{color:var(--testo)}

/* ===== 4 ottobre, sera ===== */
/* Calendario: solo la scritta, fondo come gli altri controlli; largo quanto Off-Grid, sopra di lui */
#app #btnCal{align-self:stretch;width:auto;height:48px;border-radius:16px;padding:0 14px;color:var(--verde);font-size:15px;font-weight:700;letter-spacing:.01em}
#app #btnCal .cal-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app #btnCal .num{right:-6px;top:-6px}
[dir="rtl"] #app #btnCal .num{right:auto;left:-6px}

/* strumenti di navigazione della mappa (zoom, schermo intero, posizione): in trasparenza */
#app .lato .zoom,#app .lato #btnPieno:not([aria-pressed="true"]),#app .lato #btnGps{background:color-mix(in srgb,var(--superficie) 55%,transparent);border-color:color-mix(in srgb,var(--linea-forte) 45%,transparent);box-shadow:0 2px 8px -4px rgba(40,30,20,.25)}

/* tempi: si agganciano all'inizio; quello tagliato sfuma via */
.chips{scroll-snap-type:x mandatory;scroll-padding-inline-start:0}
.chips>*{scroll-snap-align:start;transition:opacity .18s ease}
.chips>.fuori{opacity:0;pointer-events:none}
.riga-chips{position:relative}
.chips-avanti{position:absolute;right:12px;top:4px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--testo-2);cursor:pointer;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:color-mix(in srgb,var(--superficie) 80%,transparent)!important}
[dir="rtl"] .chips-avanti{right:auto;left:12px}
[dir="rtl"] .chips-avanti svg{transform:scaleX(-1)}

/* trattino: zona di presa larga, il pannello scorre */
.maniglia-btn{width:100%;max-width:160px;height:26px}
.foglio{transition:background-color .2s}
.foglio.espanso{max-height:calc(100% - 8px);height:calc(100% - 8px)}
/* regola generale: allargato perde la trasparenza, ridotto la riprende */
.foglio.espanso,#app.muove .foglio.espanso{background:var(--superficie)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.foglio.espanso *{text-shadow:none!important}

/* Strati: trasparenti ma leggibili (la mappa si intravede, le sue scritte no) */
.foglio.leggero{background:color-mix(in srgb,var(--superficie) 68%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#app.muove .foglio.leggero{background:color-mix(in srgb,var(--superficie) 86%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
.foglio.leggero .strati-lista,.foglio.leggero .riga-int,.foglio.leggero .seg{background:color-mix(in srgb,var(--superficie) 45%,transparent)}
#app.muove .peek,.peek.vetro{-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--superficie) 80%,transparent)}

/* la freccina delle sottocategorie subito dopo il nome dello strato */
.strato-riga .strato-on{flex:0 1 auto;padding-right:2px}
.strato-riga .espandi{width:34px;flex-shrink:0}
.strato-int{flex:1;min-height:56px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px 0 8px;background:none;border:0;cursor:pointer}
[dir="rtl"] .strato-int{justify-content:flex-start;padding:0 8px 0 12px}
.app.semplice .strato-riga .strato-on{flex:0 1 auto}

/* schede: Salva in calendario in alto, sotto il titolo */
.tasti-testa{margin-top:2px}

/* modulo Proponi: l'avviso in verde, in cima */
.avviso-proposte.verde{background:var(--verde);color:var(--su-verde);border:0;font-weight:600}
.avviso-proposte.verde svg{color:var(--su-verde)}

/* campo della barra dei nascosti: il tasto Sblocca non esce più dal riquadro sui telefoni stretti */
#pw{min-width:0;width:100%}
label.campo:has(#pw){min-width:0}

/* ===== Temi (come nell'app online: ovali, Strati e Temi trasversali) ===== */
.pag-temi{flex:1 0 auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:20px}
.pag-temi>*{flex-shrink:0}
.sez-temi h1{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;line-height:30px;text-wrap:balance}
.sez-temi h3{margin:0;font-family:var(--serif);font-weight:400;font-size:18px;line-height:22px}
.sez-temi p{margin:0}
.sez-temi .meta{font-size:12px;line-height:16px;color:var(--testo-2)}
.sez-temi .tipo{font-size:12px;line-height:16px;font-weight:600;color:var(--testo-2);letter-spacing:.04em;text-transform:uppercase}
.sez-temi .stack{display:flex;flex-direction:column;gap:10px}
.sez-temi .stack-s{display:flex;flex-direction:column;gap:8px}
.sez-temi .indietro{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:4px;font-weight:600;background:none;border:0;padding:0;color:var(--verde);cursor:pointer;font-size:14px;margin-bottom:-10px}
.sez-temi .link{min-height:40px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--verde);background:none;border:0;padding:0;cursor:pointer;font-size:14px}
.sez-temi .tasti{display:flex;gap:8px}
.sez-temi .tasti .tasto{flex:1}
.t-testa{position:sticky;top:0;z-index:4;margin:0 -16px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--fondo) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.t-sotto{font-size:12px;color:var(--testo-2)}
.t-icone{display:flex;gap:8px}
.t-icona{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--linea-forte);background:var(--superficie);color:var(--testo);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.t-icona.p{width:40px;height:40px;border:0;background:none;color:var(--testo-2)}
.t-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--verde);color:var(--su-verde);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.t-gruppo{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--testo-2)}
/* gli ovali */
.ovali{display:flex;flex-wrap:wrap;gap:7px}
.ovale{min-height:36px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 13px 0 11px;border:1.5px solid var(--linea-forte);background:var(--superficie);color:var(--testo-2);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.ovale .pallino{width:7px;height:7px;border-radius:50%;background:var(--dot);flex-shrink:0}
.ovale:hover{border-color:var(--dot)}
.ovale.sel,.ovale[aria-pressed="true"]{background:var(--dot);border-color:var(--dot);color:#fff}
.ovale.sel .pallino,.ovale[aria-pressed="true"] .pallino{background:rgba(255,255,255,.9)}
.ovale.p{min-height:34px;font-size:13px;padding:0 12px 0 10px}
.ovale svg{flex-shrink:0}
.ovale.lente{color:var(--testo);border-style:dashed}
.ovale.lente .meta{font-weight:600}
.t-spiega{display:flex;gap:12px;align-items:flex-start;background:var(--incassata);border-radius:14px;padding:12px;color:var(--testo-2)}
.t-spiega .t{font-weight:600;color:var(--testo)}
.t-barra{position:sticky;bottom:12px;margin-top:auto;z-index:5;border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--superficie) 94%,transparent)}
.t-barra-t{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:4px}
.t-barra .tasto{flex:none;padding:0 14px}
.t-azioni{display:flex;gap:18px;flex-wrap:wrap}
/* risultati */
.t-mappa{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--linea);height:170px}
.t-mappa-svg{display:block;width:100%;height:100%;padding:0;border:0;background:var(--mappa-terra,#EDE6D8);cursor:pointer}
.t-mappa-svg svg{display:block;width:100%;height:100%}
.t-mappa .m-lbl{display:none}
.t-mappa-lbl{position:absolute;left:8px;top:8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--superficie) 88%,transparent);border-radius:999px;padding:3px 10px;pointer-events:none}
.t-mappa-x{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:10px;border:0;background:color-mix(in srgb,var(--superficie) 88%,transparent);color:var(--testo-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.t-mappa-chiusa{min-height:48px;border-radius:14px;border:1.5px dashed var(--linea-forte);background:none;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--testo-2);cursor:pointer;font-size:14px}
.t-sezioni{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.t-sez{flex:0 0 auto;max-width:200px;min-height:56px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 12px;border-radius:14px;border:1px solid var(--linea);background:var(--superficie);text-align:left;cursor:pointer}
.t-sez .t{font-weight:600;font-size:13px;line-height:17px}
.t-sez-k{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ic,var(--testo-2))}
.t-sez.prog .t-sez-k{color:var(--clay-ink,#A85C2C)}
.t-card{position:relative;display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:13px 14px;border-radius:16px;border:1px solid var(--linea);background:var(--superficie);cursor:pointer;font-size:14px}
.t-card:hover{border-color:var(--linea-forte)}
.t-card.fin{opacity:.6}
.t-card h3{padding-right:70px}
.t-angolo{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.t-angolo.evento{background:var(--incassata);color:var(--testo-2)}
.t-angolo.pratica{background:var(--clay-tenue,#F7E6D6);color:var(--clay-ink,#A85C2C)}
.t-angolo.istanza{background:color-mix(in srgb,var(--ic) 14%,var(--superficie));color:var(--ic)}
.t-quando{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--clay-ink,#A85C2C)}
.t-card.fin .t-quando{color:var(--testo-2)}
.t-quando .forma{flex-shrink:0}
.t-desc{font-size:13px;line-height:18px;color:var(--testo-2)}
.t-etich{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.etichetta{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--tx)}
.etichetta.hit{box-shadow:inset 0 0 0 1.5px var(--dot)}
:root[data-theme="dark"] .etichetta{background:color-mix(in srgb,var(--dot) 22%,var(--superficie));color:color-mix(in srgb,var(--dot) 55%,#fff)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .etichetta{background:color-mix(in srgb,var(--dot) 22%,var(--superficie));color:color-mix(in srgb,var(--dot) 55%,#fff)}}
.t-vuoto{border:1.5px dashed var(--linea-forte);border-radius:12px;padding:12px;color:var(--testo-2)}
/* fogli Lente e Strumenti */
.sez-temi .t-lista{max-height:none}
.t-slot{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:8px 10px;border-radius:14px;border:1.5px dashed var(--linea-forte);background:none;text-align:left;cursor:pointer}
.t-slot.pieno{border-style:solid;border-color:var(--linea);background:color-mix(in srgb,var(--superficie) 60%,transparent)}
.t-slot>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t-slot .t{font-weight:600}
.t-slot-i{width:34px;height:34px;border-radius:10px;background:var(--incassata);color:var(--testo-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-slot.pieno .t-slot-i{background:var(--verde);color:var(--su-verde)}
.sez-temi .riga-int>div{display:flex;flex-direction:column;gap:1px}
.sez-temi .riga-int[disabled]{opacity:.5;cursor:default}

/* ===== Proposte (Progetti e Agorà) ===== */
.sez-proposta-in{gap:16px}
.sez-proposta h3{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;line-height:26px}
.sez-proposta p{margin:0}
.sez-proposta .stack{display:flex;flex-direction:column}

/* Le lenti di Agorapp */
.t-lenti{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,74%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-padding:0 16px}
.t-lenti::-webkit-scrollbar{display:none}
.t-lente{scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:178px;padding:14px;border-radius:18px;text-align:left;cursor:pointer;border:1px solid color-mix(in srgb,var(--lc) 28%,var(--linea));background:color-mix(in srgb,var(--lc) 9%,var(--superficie));color:var(--testo)}

.t-lente-g{width:42px;height:42px;border-radius:50%;background:var(--lc);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:4px}
.t-lente-n{font-family:var(--serif);font-size:21px;line-height:24px}
.t-lente-m{font-size:13px;line-height:18px;color:color-mix(in srgb,var(--lc) 70%,var(--testo));font-weight:600}

.t-lente-motto{font-family:var(--serif);font-size:18px;line-height:23px;color:color-mix(in srgb,var(--lc) 70%,var(--testo))}
.t-ancora{align-self:center}
:root[data-theme="dark"] .t-lente-m,:root[data-theme="dark"] .t-lente-motto,:root[data-theme="dark"] .t-lente-testa .t-gruppo{color:color-mix(in srgb,var(--lc) 45%,#fff)}

/* ======================= Ordine delle Fate (funzione nascosta) =======================
   Oro solo qui. Lo scintillio anima soltanto transform e opacity (niente sfocature, niente filtri animati):
   leggero sul telefono, fermo se il telefono chiede meno animazioni. */
:root{
  --oro-1:#7A520A; --oro-2:#C8901E; --oro-luce:#D9A21F; --oro-ink:#7A5810; --oro-bordo:#C99A3A;
  --oro-fondo:linear-gradient(140deg,#FFF3CC 0%,#EFCB6A 50%,#F8E09A 100%);
  --oro-lampo:rgba(255,253,240,.9); --oro-tenue:#FBF3DC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --oro-1:#F8DE8C; --oro-2:#E0AE45; --oro-luce:#FFE39A; --oro-ink:#EBC870; --oro-bordo:#8C6B26;
  --oro-fondo:linear-gradient(140deg,#3D3016 0%,#2B2110 55%,#3B2E13 100%);
  --oro-lampo:rgba(255,232,170,.42); --oro-tenue:#2E2715}}
:root[data-theme="dark"]{
  --oro-1:#F8DE8C; --oro-2:#E0AE45; --oro-luce:#FFE39A; --oro-ink:#EBC870; --oro-bordo:#8C6B26;
  --oro-fondo:linear-gradient(140deg,#3D3016 0%,#2B2110 55%,#3B2E13 100%);
  --oro-lampo:rgba(255,232,170,.42); --oro-tenue:#2E2715}

/* il tasto condividi d'oro, nel Calendario */
.tasto-oro{position:relative;overflow:hidden;isolation:isolate;flex:none;min-height:44px;min-width:56px;padding:0 16px;border-radius:12px;
  background:var(--oro-fondo);border:1px solid var(--oro-bordo);color:var(--oro-1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--oro-2) 14%,transparent),0 4px 14px -6px color-mix(in srgb,var(--oro-2) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s}
.tasto-oro:active{transform:scale(.96)}
.tasto-oro svg.oro{position:relative;z-index:1;filter:drop-shadow(0 0 1.5px color-mix(in srgb,var(--oro-luce) 70%,transparent))}
/* il lampo: una striscia di luce che attraversa il tasto ogni pochi secondi */
.tasto-oro::after{content:"";position:absolute;z-index:2;top:-30%;bottom:-30%;left:-70%;width:46%;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,transparent 22%,var(--oro-lampo) 50%,transparent 78%,transparent 100%);
  transform:translateX(0) skewX(-18deg);animation:oro-lampo 4.2s cubic-bezier(.45,.05,.35,1) infinite}
@keyframes oro-lampo{0%,58%{transform:translateX(0) skewX(-18deg)}86%,100%{transform:translateX(420%) skewX(-18deg)}}
/* le stelline: si accendono e si spengono a turno */
.scintilla{position:absolute;z-index:3;width:8px;height:8px;color:var(--oro-luce);pointer-events:none;opacity:0;transform:scale(.3);animation:oro-stella 2.6s ease-in-out infinite}
.scintilla svg{display:block;width:100%;height:100%}
.scintilla.s1{top:4px;right:5px;animation-delay:.3s}
.scintilla.s2{bottom:4px;left:6px;width:6px;height:6px;animation-delay:1.2s}
.scintilla.s3{top:6px;left:10px;width:5px;height:5px;animation-delay:2s}
@keyframes oro-stella{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}40%{opacity:1;transform:scale(1) rotate(45deg)}65%{opacity:0;transform:scale(.4) rotate(90deg)}}
@media (prefers-reduced-motion: reduce){
  .tasto-oro::after{animation:none;opacity:0}
  .scintilla{animation:none;opacity:.75;transform:none}}

/* testi e scatole */
.fate-ink{color:var(--oro-ink)}
.eyebrow.fate-ink{display:flex;align-items:center;gap:5px}
.stella-in{display:inline-flex;width:11px;height:11px;color:var(--oro-luce);flex-shrink:0}
.stella-in svg{width:100%;height:100%}
.fate-msg{margin:0;border-radius:12px;padding:10px 12px;background:var(--oro-tenue);border:1px solid color-mix(in srgb,var(--oro-bordo) 70%,transparent);color:var(--testo);font-size:13px;line-height:19px}
.fate-box{border-radius:12px;padding:10px 12px;background:var(--oro-tenue);display:flex;gap:10px;align-items:flex-start}
.fate-box .stella-in{width:14px;height:14px;margin-top:3px}
.fate-link{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:16px;color:var(--testo-2);word-break:break-all;
  background:var(--incassata);border:1px dashed var(--oro-bordo);border-radius:12px;padding:10px 12px;max-height:68px;overflow:hidden;
  -webkit-user-select:all;user-select:all;position:relative}
.fate-link::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(transparent,var(--incassata))}

/* scelta PDF o pacchetto */
.scelta-cond{min-height:72px;text-align:left}
.scelta-cond .cond-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--incassata);color:var(--testo)}
.scelta-cond .cond-ico.oro{background:var(--oro-fondo);border:1px solid var(--oro-bordo);color:var(--oro-luce)}
.scelta-cond .cond-ico.oro svg{width:18px;height:18px}
.scelta-cond.oro{border-color:color-mix(in srgb,var(--oro-bordo) 75%,transparent)}
.scelta-cond .freccia-dir{flex-shrink:0;color:var(--testo-2)}

/* strato: le persone come sottocategorie */
.sub.fate-sub{padding:0 2px 4px}
[dir="rtl"] .sub.fate-sub{padding:0 2px 4px}

/* ======================= Misure (solo admin) ======================= */
/* colori dei grafici: verde in scala (una sola tinta, chiaro → scuro), tre categorie verificate per il daltonismo (validate_palette, 6 ottobre 2026) */
:root{
  --mz-s0:#EEF3EE; --mz-s1:#D3E4D7; --mz-s2:#A9CBB2; --mz-s3:#6FA585; --mz-s4:#3D7A55; --mz-s5:#2D5A3D;

  --mz-ok:#2D6B45; --mz-ok-t:#DCE8DF; --mz-warn:#8A5A00; --mz-warn-t:#FBF0D6; --mz-crit:#A33A2A; --mz-crit-t:#F8E1DC;
}

  --mz-s0:#26231E; --mz-s1:#2C3A30; --mz-s2:#365240; --mz-s3:#4A7558; --mz-s4:#659C78; --mz-s5:#8CC09D;
  --mz-c1:#4A9E68; --mz-c2:#6A8FD6; --mz-c3:#C8733C; --mz-nd:#6B6357; --mz-griglia:rgba(242,235,224,.09);
  --mz-ok:#8CC09D; --mz-ok-t:#22382A; --mz-warn:#E7B850; --mz-warn-t:#3A2E12; --mz-crit:#EE9283; --mz-crit-t:#3E1F1A; } }
:root[data-theme="dark"]{
  --mz-s0:#26231E; --mz-s1:#2C3A30; --mz-s2:#365240; --mz-s3:#4A7558; --mz-s4:#659C78; --mz-s5:#8CC09D;
  --mz-c1:#4A9E68; --mz-c2:#6A8FD6; --mz-c3:#C8733C; --mz-nd:#6B6357; --mz-griglia:rgba(242,235,224,.09);
  --mz-ok:#8CC09D; --mz-ok-t:#22382A; --mz-warn:#E7B850; --mz-warn-t:#3A2E12; --mz-crit:#EE9283; --mz-crit-t:#3E1F1A; }

.sez-misure{display:block}
.mz-testa{position:sticky;top:0;z-index:3;background:var(--fondo);padding:0 16px 0;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:8px}

scosto con questa password.":"No hidden event with this password.","Cerco…":"Searching…","Nessun indirizzo trovato. Prova a scrivere solo via e città.":"No address found. Try writing just street and city.","Tocca il primo giorno, poi l’ultimo. Il puntino dice che quel giorno c’è qualcosa.":"Tap the first day, then the last. A dot means something is on that day.","Mostra {g} sulla mappa · {n}":"Show {g} on the map · {n}","Scegli almeno un giorno":"Choose at least one day","<p><b>Che cos’è un evento Off-Grid?</b><br>È un tuo appuntamento: vive solo nella memoria di questo dispositivo, non passa da nessun server e nessuno oltre a te può vederlo. Ti serve per organizzare la giornata sulla mappa e nel calendario, accanto agli eventi della città.</p><p><b>Perché non posso ancora pubblicarlo per tutti?</b><br>Pubblicare un evento <i>on-grid</i> vuol dire affidarci i dati tuoi e di chi lo organizza. Oggi Agorapp è un progetto indipendente, senza ancora una società alle spalle in grado di custodirli con le garanzie che meritano: preferiamo non raccoglierli piuttosto che raccoglierli male.</p><p><b>Presto sarà possibile.</b> Ci stiamo lavorando: quando potrai pubblicare i tuoi eventi per tutta la città, sarai tra i primi a saperlo.</p>":"<p><b>What is an Off-Grid event?</b><br>It’s your own appointment: it lives only in this device’s memory, never passes through any server and nobody but you can see it. Use it to plan your day on the map and in the calendar, next to the city’s events.</p><p><b>Why can’t I publish it for everyone yet?</b><br>Publishing an <i>on-grid</i> event means trusting us with your data and the organiser’s. Today Agorapp is an independent project, without a company behind it that can look after that data with the guarantees it deserves: we’d rather not collect it than collect it badly.</p><p><b>It’s coming soon.</b> We’re working on it: when you can publish your events for the whole city, you’ll be among the first to know.</p>","Non si ripete":"Does not r te, quello che si può fare per il clima vicino a casa.":"For those who want to cross the city on foot or by bike, and find shade along the way. Parks to look after, gardens, rides, what can be done for the climate close to home.","Porte aperte":"Open doors","Qui nessuno è ospite.":"Nobody is a guest here.","Dove chi arriva da lontano, chi non sente, chi non vede bene o parla un’altra lingua trova posto senza doverlo chiedere. Scuole di italiano, cori, tamburi, sportelli.":"Where those who come from far away, who can't hear, who can't see well or speak another language find a place without having to ask. Italian schools, choirs, drums, help desks.","Mani in pasta":"Hands on","Si impara facendo.":"You learn by doing.","Aggiustare una bici, cucire, costruire una cassetta per i libri, rimettere in piedi uno spazio vuoto. Per chi preferisce fare piuttosto che guardare.":"Fixing a bike, sewing, building a box for books, bringing an empty space back to life. For those who'd rather do than watch.","A tavola insieme":"At the table together","Mangiare insieme è già fare comunità.":"Eating together is already community.","Merende in cortile, pranzi sociali, mercati di quartiere. Per chi pensa che una tavola lunga risolva più cose di quante sembri.":"Courtyard snacks, social lunches, neighbourhood markets. For those who think a long table solves more things than it seems.","Prendere parola":"Speaking up","Dove la città alza la mano.":"Where the city raises its hand.","Assemblee, cortei, tavoli delle istanze, scuole popolari: i posti dove si impara a dire la propria e a farla contare. Per chi pensa che le regole si possano cambiare.":"Assemblies, marches, proposal tables, popular schools: the places where you learn to have your say and make it count. For those who think rules can be changed.","Prendersi cura":"Taking care","Nessuno se la cava da solo.":"Nobody gets by alone.","Ambulatori diffusi, scambi di competenze, nonne che cucinano, chi dà una mano il sabato. Per chi sa che ong>, visible on the map. Afterwards, the table publishes the <strong>report</strong>: what was discussed and what step forward was taken toward the goal.","Tutte le istanze":"All proposals","Istanza permanente":"Permanent proposal","Come funzionano i tavoli":"How tables work","I tavoli":"The tables","I tavoli sono in ordine di apertura, non di popolarità.":"Tables are in order of opening, not popularity.","Passo avanti":"Step forward","Prossimo incontro":"Next meeting","Primo incontro":"First meeting","evento Istanza":"Proposal event","Il tavolo ha finito il suo lavoro":"The table has finished its work","La parte è pronta":"The part is ready","La sua parte è nella proposta consegnata il {d}.":"Its part is in the proposal delivered on {d}.","aperto da {d}":"open since {d}","La parte di questo tavolo:":"This table’s part:","La parte scritta":"The written part","C’è ancora posto":"There’s still room","Il tavolo cerca:":"The table is looking for:","Il cammino del tavolo":"The table’s path","Nessun incontro ancora. Dopo il primo, qui compariranno i passi avanti e i rendiconti.":"No meetings yet. After the first one, the steps forward and reports will appear here.","già svolto · leggi il rendiconto":"already held · read the report","La proposta consegnata il {d}":"The proposal delivered on {d}","leggi la proposta":"read the proposal","Rendiconto":"Report","Incontro di {d}":"Meeting on {d}","Evento Istanza":"Proposal event","Presenti {p} soggetti · scritto da {s} per il tavolo · pubblicato il {d}":"{p} groups present · written by {s} for the table · published on {d}","Di cosa si è parlato":"What was discussed","Il passo avanti verso l’obiettivo":"The step forward toward the goal","Cosa resta aperto":"What remains open","Chi fa cosa prima dell’incontro successivo":"Who does what before the following meeting","Chi fa cosa prima del prossimo incontro":"Who does what before the next meeting","Chi fa cosa adesso":"Who does what now","Incontro successivo":"Following meeting","E he map the meeting carries its proposal’s icon and color. In the app the map of {c} opens, centered on the meeting.","Tutto pronto, iscrizioni in arrivo":"All set, sign-ups coming soon","Progetti e Agorà partiranno quando potremo accogliere chi vi partecipa. Intanto puoi vedere com’è fatto tutto: le bacheche dei progetti, le persone che ci tengono, i tavoli delle istanze, gli eventi sulla mappa.":"Projects and Agora will start when we’re able to welcome the people who take part. Meanwhile you can see how everything looks: the project boards, the people who care, the proposal tables, the events on the map.","Le istanze sono quelle dell’app. Obiettivi, tavoli, soggetti e rendiconti sono d’esempio; ogni istanza è messa a un punto diverso del cammino, per vedere come appare dall’inizio alla fine.":"The proposals are the ones in the app. Goals, tables, groups and reports are examples; each proposal is set at a different point on its path, so you can see how it looks from start to finish.","Vuoi proporre un tavolo? Scrivi a":"Want to propose a table? Write to","Ancora":"Anchor","Fata":"Fairy","Vorrebbe venire, cerca compagnia":"Would like to come, looking for company","Vorrebbe venire":"Would like to come","Tu":"You","Chi ci tiene":"Who cares","Le persone legate al progetto.":"The people connected to the project.","Il bollino ti dice chi sono e a chi puoi scrivere.":"The badge tells you who they are and who you can write to.","Le Ancore":"The Anchors","Reggono il progetto. Scrivi a loro per organizzarti.":"They hold the project. Write to them to get organized.","Le Fate":"The Fairies","Ci tengono e ci sono spesso. Puoi scrivere a loro per sapere com’è, prima di venire.":"They care about it and are often there. You can write to them to ask what it’s like before you come.","Vorrebbero venire il {d}":"Would like to come on {d}","Solo chi ha scelto di farlo sapere. Con il bollino, chi cerca qualcuno con cui andare.":"Only those who chose to let others know. With the badge: those looking for someone to go with.","Ci sei anche tu":"You’re here too","Vorrei venire anch’io":"I’d like to come too","Tutti salvati":"All saved","Mappa stilizzata con i luoghi già toccati dal progetto e quello del prossimo appuntamento":"Stylized map with the places the project has already been and the place of the next meetup","Tutti i progetti":"All projects","Da {d}":"Since {d}","Il prossimo appuntamento · evento Pratica":"The next meetup · Practice event","Ecco cosa serve perché il {d} succeda.":"Here’s what’s needed to make {d} happen.","1 posto ancora libero":"1 spot still open","{n} posti ancora liberi":"{n} spots still open","Coperto":"Covered","Scrivi alle Ancore":"Write to the Anchors","Come funziona un progetto":"How a project works","Ogni appuntamento del progetto è un <strong>evento Pratica</strong> sulla mappa e porta il nome del progetto. Prima di ogni appuntamento la bacheca dice cosa serve. Qui non c’è una chat: per organizzarvi scrivete alle Ancore o alle Fate, e la conversazione resta nei vostri canali.":"Every meetup of the project is a <strong>Practice event</strong> on the map and carries the project’s name. Before each meetup the board says what’s needed. There’s no chat here: to get organized, write to the Anchors or the Fairies, and the conversation stays in your own channels.","Pratiche collettive nel tessuto urbano":"Collective practices in the urban fabric","La produzione culturale non avviene dove viene riconosciuta. Avviene nei cortili, nei presidi, nelle assemblee informali. Questi progetti esistono indipendentemente da Agorapp: la piattaforma rende visibile ciò che era già in atto.":"Cultural production doesn’t happen where it gets recognized. It happens in courtyards, in community spaces, in informal assemblies. These projects exist independently of Agorapp: the platform makes visible what was already happening.","Cosa vogliono dire le etichette":"What the labels mean","Cosa serve:":"What’s needed:","Prossimo appuntamento:":"Next
