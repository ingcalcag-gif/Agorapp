ourtyard hosting it.","Cosa vuoi salvare?":"What do you want to save?","Solo il {d}":"Only on {d}","Tutti gli appuntamenti del progetto":"All the project’s meetups","Compaiono nel calendario man mano che vengono fissati":"They appear in the calendar as they’re scheduled","Togli dal calendario":"Remove from calendar","Se un appuntamento viene annullato, lo vedi quando riapri il calendario: Agorapp non manda notifiche. Si elimina come gli altri eventi ricorrenti: solo questo giorno o tutta la serie.":"If a meetup is canceled, you’ll see it when you reopen the calendar: Agorapp doesn’t send notifications. You delete it like other recurring events: just this day or the whole series.","Collettivo":"Collective","Persona":"Person","Ancora da {d}":"Anchor since {d}","Fata da {d}":"Fairy since {d}","Vorrebbe venire {d}":"Would like to come {d}","Nel progetto":"In the project","Cerca qualcuno con cui andare":"Looking for someone to go with","Scrivi per andarci insieme":"Write to go together","Scrivi per allearti":"Write to team up","Il recapito che ha scelto di rendere pubblico":"The contact they chose to make public","email o telefono":"email or phone","Ha scelto di farsi vedere, ma non di essere contattato.":"They chose to be visible, but not to be contacted.","Il profilo mostra solo ciò che ha fatto apparire nel progetto: niente seguaci, niente contatori.":"The profile only shows what they made visible in the project: no followers, no counters.","Fammi vedere tra chi vorrebbe venire":"Show me among those who’d like to come","Il tuo nome compare nella bacheca fino all’appuntamento, poi sparisce.":"Your name appears on the board until the meetup, then disappears.","Cerco qualcuno con cui andare":"I’m looking for someone to go with","Accanto al tuo nome compare il bollino. Chi vuole può scriverti.":"The badge appears next to your name. Anyone who wants can write to you.","Anteprima: con le iscrizioni aperte servirà un profilo. Qui puoi provare come apparirebbe.":"Preview: once sign-ups open you’ll need a profile. Here you can try how it would look.","La bacheca stampata":"The printed board","Le Ancore: {n}, [recapito]. Questa bacheca è anche su Agorapp, sezione Progetti.":"The Anchors: {n}, [contact]. This board is also on Agorapp, in the Projects section.","Nell’app si scarica in PDF, come il PDF della giornata. Così il progetto arriva anche a chi non usa lo smartphone e non è nei gruppi di chat.":"In the app you download it as a PDF, like the PDF of your day. That way the project also reaches people who don’t use a smartphone and aren’t in the chat groups.","I progetti in elenco sono quelli dell’app. Date, persone e cortili del Cortile Comune sono d’esempio.":"The listed projects are the ones in the app. Dates, people and courtyards of Cortile Comune are examples.","Vuoi portare il tuo progetto? Scrivi a":"Want to bring your project? Write to","Con le iscrizioni aperte si apre il tuo programma di posta, con il recapito già scritto. Agorapp non ha una chat.":"Once sign-ups open, your email app opens with the address already filled in. Agorapp has no chat.","{n} caratteri · almeno {m}":"{n} characters · at least {m}","Progetti · proposta":"Projects · proposal","Un progetto è qualcosa che esiste già o sta per partire: un cortile aperto, un coro, una sartoria. Agorapp lo rende visibile, non lo gestisce.":"A project is something that already exists or is about to start: an open courtyard, a choir, a sewing workshop. Agorapp makes it visible, it doesn’t run it.","Agorà · proposta":"Agora · proposal","Un’istanza è un’ipotesi di trasformazione con un obiettivo comune. Si apre con un primo tavolo: soggetti che si incontrano di persona e scrivono una parte della proposta.":"A proposal is an idea for change with a shared goal. It opens with a first table: groups that meet in person and write one part of the proposal.","Stiamo lavorando alla ricezione delle proposte: è prevista per la prima metà del 2027. Per ora il modulo è un’anteprima: non invia e non salva niente.":"We’re working on receiving proposals: it’s planned for the first half of 2027. For now the form is a preview: it doesn’t send or save anything.","Come si chiama":"What’s it called","es. Il Cortile Comune":"e.g. Il Cortile Comune","Dove":"Where","quartiere o zona":"neighborhood or area","es. Crocetta, oppure Tutta la città":"e.g. Crocetta, or Whole city","Cosa fa":"What it does","Racconta il progetto: cosa succede, ogni quanto, per chi.":"Tell us about the project: what happens, how often, for whom.","uno o più":"one or more","fino a 3":"up to 3","Cosa serve adesso":"What’s needed now","es. un cortile, mani per la merenda, sedie":"e.g. a courtyard, hands for the snack, chairs","Come vuoi esserci":"How you want to take part","Indipendente: il progetto fa tutto da sé. Accompagnato: Agorapp aiuta a partire, poi si fa da parte.":"Independent: the project does everything on its own. Supported: Agorapp helps it get started, then steps back.","Chi lo regge":"Who holds it","una persona di riferimento, un’Ancora":"a contact person, an Anchor","Nome, anche solo di battesimo":"Name, even just a first name","Dove risponderti":"Where to reply to you","nome@esempio.it":"name@example.com","es. Diritto abitativo":"e.g. Housing rights","Cosa vuole cambiare":"What it wants to change","La tensione da cui nasce e cosa dovrebbe cambiare.":"The tension it comes from and what should change.","L’obiettivo, in una frase":"The goal, in one sentence","tutti i tavoli lavoreranno per questo":"all tables will work toward this","es. Nuove regole urbane per gli affitti":"e.g. New urban rules for rents","Il primo tavolo: da quale parte cominciare":"The first table: which part to start with","es. un tetto agli affitti, zona per zona":"e.g. a cap on rents, area by area","Chi propone":"Who’s proposing","il soggetto che si siede al primo tavolo":"the group that sits at the first table","es. Assemblea inquilini Vanchiglia":"e.g. Vanchiglia Tenants’ Assembly","In che città":"Which city","es. Torino":"e.g. Turin","Agorapp non ha una chat: la redazione ti risponderà per email. L’indirizzo servirà solo per questa proposta.":"Agorapp has no chat: the editorial team will reply by email. The address will only be used for this proposal.","Prova a inviare":"Try sending","Il modulo funziona così":"This is how the form works","«{t}» è scritta, ma per ora non parte: la ricezione delle proposte è prevista per la prima metà del 2027. Allora arriverà alla redazione di Agorapp, che ti scriverà all’indirizzo che hai dato.":"“{t}” is written, but for now it doesn’t go anywhere: receiving proposals is planned for the first half of 2027. Then it will reach the Agorapp editorial team, who will write to you at the address you gave.","Non abbiamo salvato né inviato niente: né la proposta né l’email.":"We haven’t saved or sent anything: neither the proposal nor the email.","Se il progetto entra, avrà la sua bacheca e i suoi appuntamenti sulla mappa come eventi Pratica.":"If the project gets in, it will have its own board and its meetups on the map as Practice events.","Se l’istanza si apre, il primo tavolo avrà la sua pagina nell’Agorà e i suoi incontri sulla mappa come eventi Istanza.":"If the proposal opens, the first table will have its own page in the Agora and its meetings on the map as Proposal events.","Manca questo":"This is missing","Servono almeno {n} caratteri":"At least {n} characters needed","Scegli almeno uno strato":"Choose at least one layer","Scegli come vuoi esserci":"Choose how you want to take part","Scrivi un indirizzo email valido":"Enter a valid email address","Al massimo {n} temi":"At most {n} themes","{n} caratteri":"{n} characters","Cosa vuol dire":"What it means","Da iniziare":"To start","Domanda scritta":"Question written","Dati in raccolta":"Collecting data","Prima bozza della regola":"First draft of the rule","Testo pronto":"Text ready","Confermato":"Confirmed","Da confermare":"To be confirmed","Agorapp ci lavora in prima persona: lo itano: preferiamo non raccoglierli piuttosto che raccoglierli male.</p><p><b>Presto sarà possibile.</b> Ci stiamo lavorando: quando potrai pubblicare i tuoi eventi per tutta la città, sarai tra i primi a saperlo.</p>":"<p><b>¿Qué es un evento Off-Grid?</b><br>Es una cita tuya: vive solo en la memoria de este dispositivo, no pasa por ningún servidor y nadie más que tú puede verla. Te sirve para organizar el día en el mapa y en el calendario, junto a los eventos de la ciudad.</p><p><b>¿Por qué todavía no puedo publicarlo para todos?</b><br>Publicar un evento <i>on-grid</i> significa confiarnos tus datos y los de quien organiza. Hoy Agorapp es un proyecto independiente, todavía sin una sociedad detrás capaz de custodiarlos con las garantías que merecen: preferimos no recogerlos antes que recogerlos mal.</p><p><b>Pronto será posible.</b> Estamos trabajando en ello: cuando puedas publicar tus eventos para toda la ciudad, estarás entre los primeros en saberlo.</p>","Non si ripete":"No se repite","Ogni giorno":"Cada día","Dal lunedì al venerdì":"De lunes a viernes","Ogni {g}":"Cada {g}","Ogni 2 settimane, di {g}":"Cada 2 semanas, el {g}","Ogni mese, il giorno {n}":"Cada mes, el día {n}","Punto scelto sulla mappa":"Punto elegido en el mapa","Registriamo questo punto":"Guardamos este punto","Numero civico trovato sulla mappa.":"Número encontrado en el mapa.","Registriamo questo punto · verifica":"Guardamos este punto · comprueba","Il civico {n} non è presente sulla mappa: il punto è sulla via. Tocca «Scegli sulla mappa» per spostarlo sul portone giusto.":"El número {n} no está en el mapa: el punto está en la calle. Toca «Elegir en el mapa» para moverlo al portal correcto.","Nessun numero civico: il punto è al centro della via o del luogo. Aggiungi il civico o scegli sulla mappa per essere precisi.":"Sin número: el punto está en el centro de la calle o del lugar. Añade el número o elige en el mapa para ser preciso.","Punto scelto da te sulla mappa.":"Punto elegido por ti en e producción cultural no ocurre donde se reconoce. Ocurre en los patios, en los espacios vecinales, en las asambleas informales. Estos proyectos existen con independencia de Agorapp: la plataforma hace visible lo que ya estaba en marcha.","Cosa vogliono dire le etichette":"Qué significan las etiquetas","Cosa serve:":"Qué hace falta:","Prossimo appuntamento:":"Próxima cita:","Apri":"Abrir","Nessun progetto in questo strato.":"Ningún proyecto en esta capa.","Carica altri {n}":"Cargar {n} más","Hai visto tutto: 1 progetto.":"Lo has visto todo: 1 proyecto.","Hai visto tutto: {n} progetti.":"Lo has visto todo: {n} proyectos.","I progetti sono nell’ordine in cui sono arrivati, non di popolarità.":"Los proyectos están en el orden en que llegaron, no de popularidad.","Proponi un nuovo progetto":"Propón un nuevo proyecto","Qualcosa che esiste già o sta per partire, nel tuo quartiere":"Algo que ya existe o está a punto de arrancar, en tu barrio","Il prossimo appuntamento":"La próxima cita","Nessun appuntamento fissato per ora. Quando c’è, compare qui e sulla mappa.":"Por ahora no hay ninguna cita fijada. Cuando la haya, aparecerá aquí y en el mapa.","Quello che il progetto cerca adesso.":"Lo que el proyecto busca ahora.","Cercasi":"Se busca","Ogni appuntamento del progetto è un <strong>evento Pratica</strong> sulla mappa e porta il nome del progetto. Prima di ogni appuntamento la bacheca dice cosa serve. Qui non c’è una chat: per organizzarvi scrivete alle Ancore, e la conversazione resta nei vostri canali.":"Cada cita del proyecto es un <strong>Evento Práctica</strong> en el mapa y lleva el nombre del proyecto. Antes de cada cita el tablón dice qué hace falta. Aquí no hay chat: para organizaros escribid a las Anclas, y la conversación se queda en vuestros canales.","Evento Pratica":"Evento Práctica","Anteprima della mappa con il segnaposto dell’evento Pratica":"Vista previa del mapa con el marcador del Evento Práctica","Il segnaposto dell’evento Pratica ha il doppio cerchio, e il popup porta alla bacheca del progetto. Il civico compare dal giorno prima, con il consenso del condominio. A ogni appuntamento il segnaposto si sposta sul cortile che ospita.":"El marcador del Evento Práctica tiene doble círculo, y la ventana emergente lleva al tablón del proyecto. El número del portal aparece desde el día anterior, con el consentimiento de la comunidad de vecinos. En cada cita el marcador se mueve al patio que la acoge.","Cosa vuoi salvare?":"¿Qué quieres guardar?","Solo il {d}":"Solo el {d}","Tutti gli appuntamenti del progetto":"Todas las citas del proyecto","Compaiono nel calendario man mano che vengono fissati":"Aparecen en el calendario a medida que se fijan","Togli dal calendario":"Quitar del calendario","Se un appuntamento viene annullato, lo vedi quando riapri il calendario: Agorapp non manda notifiche. Si elimina come gli altri eventi ricorrenti: solo questo giorno o tutta la serie.":"Si una cita se cancela, lo verás cuando vuelvas a abrir el calendario: Agorapp no envía notificaciones. Se elimina como los demás eventos recurrentes: solo este día o toda la serie.","Collettivo":"Colectivo","Persona":"Persona","Ancora da {d}":"Ancla desde {d}","Fata da {d}":"Hada desde {d}","Vorrebbe venire {d}":"Le gustaría venir {d}","Nel progetto":"En el proyecto","Cerca qualcuno con cui andare":"Busca a alguien con quien ir","Scrivi per andarci insieme":"Escribe para ir juntos","Scrivi per allearti":"Escribe para aliarte","Il recapito che ha scelto di rendere pubblico":"El contacto que ha elegido hacer público","email o telefono":"email o teléfono","Ha scelto di farsi vedere, ma non di essere contattato.":"Ha elegido dejarse ver, pero no que le contacten.","Il profilo mostra solo ciò che ha fatto apparire nel progetto: niente seguaci, niente contatori.":"El perfil solo muestra lo que ha hecho aparecer en el proyecto: nada de seguidores, nada de contadores.","Fammi vedere tra chi vorrebbe venire":"Muéstrame entre quienes quieren venir","Il tuo nome co  de passe de l’événement","Sblocca":"Débloquer","Nessun evento nascosto con questa password.":"Aucun événement caché avec ce mot de passe.","Cerco…":"Recherche…","Nessun indirizzo trovato. Prova a scrivere solo via e città.":"Aucune adresse trouvée. Essayez d’écrire seulement rue et ville.","Tocca il primo giorno, poi l’ultimo. Il puntino dice che quel giorno c’è qualcosa.":"Touchez le premier jour, puis le dernier. Le point indique qu’il se passe quelque chose ce jour-là.","Mostra {g} sulla mappa · {n}":"Afficher {g} sur la carte · {n}","Scegli almeno un giorno":"Choisissez au moins un jour","<p><b>Che cos’è un evento Off-Grid?</b><br>È un tuo appuntamento: vive solo nella memoria di questo dispositivo, non passa da nessun server e nessuno oltre a te può vederlo. Ti serve per organizzare la giornata sulla mappa e nel calendario, accanto agli eventi della città.</p><p><b>Perché non posso ancora pubblicarlo per tutti?</b><br>Pubblicare un evento <i>on-grid</i> vuol dire affidarci i dati tuoi e di chi lo organizza. Oggi Agorapp è un progetto indipendente, senza ancora una società alle spalle in grado di custodirli con le garanzie che meritano: preferiamo non raccoglierli piuttosto che raccoglierli male.</p><p><b>Presto sarà possibile.</b> Ci stiamo lavorando: quando potrai pubblicare i tuoi eventi per tutta la città, sarai tra i primi a saperlo.</p>":"<p><b>Qu’est-ce qu’un événement Off-Grid ?</b><br>C’est un rendez-vous à vous : il vit seulement dans la mémoire de cet appareil, ne passe par aucun serveur et personne d’autre que vous ne peut le voir. Il sert à organiser la journée sur la carte et dans le calendrier, à côté des événements de la ville.</p><p><b>Pourquoi ne puis-je pas encore le publier pour tous ?</b><br>Publier un événement <i>on-grid</i> veut dire nous confier vos données et celles des organisateurs. Aujourd’hui Agorapp est un projet indépendant, sans encore de société derrière lui capable de les garder avec les garanties qu’elles méritent : nous préférons ne pas les collecter plutôt que de mal les collecter.</p><p><b>Ce sera bientôt possible.</b> Nous y travaillons : quand vous pourrez publier vos événements pour toute la ville, vous serez parmi les premiers à le savoir.</p>","Non si ripete":"Ne se répète pas","Ogni giorno":"Chaque jour","Dal lunedì al venerdì":"Du lundi au vendredi","Ogni {g}":"Chaque {g}","Ogni 2 settimane, di {g}":"Toutes les 2 semaines, le {g}","Ogni mese, il giorno {n}":"Chaque mois, le {n}","Punto scelto sulla mappa":"Point choisi sur la carte","Registriamo questo punto":"Nous enregistrons ce point","Numero civico trovato sulla mappa.":"Numéro trouvé sur la carte.","Registriamo questo punto · verifica":"Nous enregistrons ce point · à vérifier","Il civico {n} non è presente sulla mappa: il punto è sulla via. Tocca «Scegli sulla mappa» per spostarlo sul portone giusto.":"Le numéro {n} n’est pas sur la carte : le point est sur la rue. Touchez « Choisir sur la carte » pour le déplacer sur la bonne porte.","Nessun numero civico: il punto è al centro della via o del luogo. Aggiungi il civico o scegli sulla mappa per essere precisi.":"Sans numéro : le point est au milieu de la rue ou du lieu. Ajoutez le numéro ou choisissez sur la carte pour être précis.","Punto scelto da te sulla mappa.":"Point choisi par vous sur la carte.","L’orario di fine coincide con l’inizio: cambialo":"L’heure de fin est la même que le début : changez-la","Finisce il giorno dopo: {g} alle {o}":"Se termine le lendemain : {g} à {o}","La data di fine ripetizione deve essere dopo il primo giorno":"La date de fin de répétition doit être après le premier jour","Al massimo un anno di ripetizioni":"Un an de répétitions au maximum","{n} date in calendario":"{n} dates dans le calendrier","Modifica evento Off-Grid":"Modifier l’événement Off-Grid","Nuovo evento Off-Grid":"Nouvel événement Off-Grid","Che cos’è un evento Off-Grid?":"Qu’est-ce qu’un événement Off-Grid ?","Solo su questo dispositivo · lo vedi solo tu":"Seulement sur cet ,"Il cammino comincia {d} a {c}, con il primo incontro del Tavolo {n}. Dopo ogni incontro, qui compare il passo avanti.":"Le chemin commence {d} à {c}, avec la première rencontre de la Table {n}. Après chaque rencontre, le pas en avant apparaît ici.","Tutti i passi avanti dei tavoli, dal più recente. Il numero nel cerchio è il tavolo.":"Tous les pas en avant des tables, du plus récent au plus ancien. Le numéro dans le cercle, c’est la table.","Mostra altri {n} passi avanti":"Afficher {n} autres pas en avant","Hai visto tutti i {n} passi avanti.":"Tu as vu les {n} pas en avant.","prossimo {d}":"prochaine rencontre {d}","Il tavolo si sta apparecchiando":"On est en train de mettre la table","primo incontro {d}":"première rencontre {d}","{n} incontri · la sua parte è nella proposta consegnata":"{n} rencontres · sa partie est dans la proposition remise","{n} incontri fatti · parte pronta, aspetta gli altri tavoli":"{n} rencontres ont eu lieu · partie prête, elle attend les autres tables","{n} soggetti":"{n} collectifs","Per l’obiettivo:":"Pour l’objectif :","Ultimo passo avanti":"Dernier pas en avant","Ancora nessun rendiconto: il primo arriverà dopo l’incontro di {c}.":"Pas encore de compte rendu : le premier arrivera après la rencontre de {c}.","Al tavolo c’è ancora posto":"Il reste de la place à la table","Apri il tavolo":"Ouvrir la table","Ogni tavolo affronta una parte dell’obiettivo e si incontra di persona. Ogni incontro è un <strong>evento Istanza</strong>, visibile sulla mappa; dopo, il tavolo pubblica il <strong>rendiconto</strong>. Quando una parte è pronta diventa una regola di Agorapp, e il tavolo riparte.":"Chaque table traite une partie de l’objectif et se réunit en personne. Chaque rencontre est un <strong>événement Instance</strong>, visible sur la carte ; ensuite, la table publie le <strong>compte rendu</strong>. Quand une partie est prête, elle devient une règle d’Agorapp, et la table repart.","Ogni tavolo affronta una parte dell’obiettivo. Chi siede al tavolo si incontra di persona, ogni volta in un luogo diverso. Ogni incontro è un <strong>evento Istanza</strong>, visibile sulla mappa. Dopo, il tavolo pubblica il <strong>rendiconto</strong>: di cosa si è parlato e quale passo avanti si è fatto verso l’obiettivo.":"Chaque table traite une partie de l’objectif. Celles et ceux qui sont à la table se retrouvent en personne, chaque fois dans un lieu différent. Chaque rencontre est un <strong>événement Instance</strong>, visible sur la carte. Ensuite, la table publie le <strong>compte rendu</strong> : de quoi on a parlé et quel pas en avant a été fait vers l’objectif.","Tutte le istanze":"Toutes les instances","Istanza permanente":"Instance permanente","Come funzionano i tavoli":"Comment marchent les tables","I tavoli":"Les tables","I tavoli sono in ordine di apertura, non di popolarità.":"Les tables sont dans l’ordre d’ouverture, pas de popularité.","Passo avanti":"Pas en avant","Prossimo incontro":"Prochaine rencontre","Primo incontro":"Première rencontre","evento Istanza":"événement Instance","Il tavolo ha finito il suo lavoro":"La table a fini son travail","La parte è pronta":"La partie est prête","La sua parte è nella proposta consegnata il {d}.":"Sa partie est dans la proposition remise le {d}.","aperto da {d}":"ouverte depuis le {d}","La parte di questo tavolo:":"La partie de cette table :","La parte scritta":"La partie écrite","C’è ancora posto":"Il reste de la place","Il tavolo cerca:":"La table cherche :","Il cammino del tavolo":"Le chemin de la table","Nessun incontro ancora. Dopo il primo, qui compariranno i passi avanti e i rendiconti.":"Pas encore de rencontre. Après la première, les pas en avant et les comptes rendus apparaîtront ici.","già svolto · leggi il rendiconto":"a déjà eu lieu · lire le compte rendu","La proposta consegnata il {d}":"La proposition remise le {d}","leggi la proposta":"lire la proposition","Rendiconto":"Compte rendu","Incontro di {d}":"Rencontre du {d}","Evento Istanza":"Événement Instance","Presenti {p} soggetti · scritto da {s} per il tavolo · pubblicato il {d}":"{p} collectifs présents · écrit par {s} pour la table · publié le {d}","Di cosa si è parlato":"De quoi on a parlé","Il passo avanti verso l’obiettivo":"Le pas en avant vers l’objectif","Cosa resta aperto":"Ce qui reste ouvert","Chi fa cosa prima dell’incontro successivo":"Qui fait quoi avant la rencontre suivante","Chi fa cosa prima del prossimo incontro":"Qui fait quoi avant la prochaine rencontre","Chi fa cosa adesso":"Qui fait quoi maintenant","Incontro successivo":"Rencontre suivante","E poi":"Et ensuite","Rendiconto del passo {n}":"Compte rendu de l’étape {n}","PDF del rendiconto":"PDF du compte rendu","Proposta consegnata il {d}":"Proposition remise le {d}","ultimo incontro {d}":"dernière rencontre {d}","Obiettivo:":"Objectif :","Le parti":"Les parties","apri l’istanza":"ouvrir l’instance","Tutte":"Toutes","Istanze civiche dal basso":"Instances citoyennes venues d’en bas","Le istanze che vedi qui non sono petizioni. Sono ipotesi di trasformazione nate dal basso: dagli eventi, dalle assemblee, dalle conversazioni nei cortili. Ogni istanza ha un obiettivo, e tavoli che ci lavorano. Ognuna è a un punto diverso del suo cammino.":"Les instances que tu vois ici ne sont pas des pétitions. Ce sont des hypothèses de transformation nées d’en bas : des événements, des assemblées, des conversations dans les cours. Chaque instance a un objectif, et des tables qui y travaillent. Chacune en est à un point différent de son chemin.","Filtra per strato":"Filtrer par calque","Nessuna istanza in questo strato.":"Aucune instance dans ce calque.","Le istanze sono in ordine di apertura, non di popolarità.":"Les instances sont dans l’ordre d’ouverture, pas de popularité.","Proponi una nuova istanza":"Proposer une nouvelle instance","Un obiettivo comune e un primo tavolo da apparecchiare":"Un objectif commun et une première table à dresser","Obiettivo":"Objectif","Di cosa":"De quoi","Resta aperto":"Reste ouvert","Chi fa cosa":"Qui fait quoi","Scritto da {s} per il tavolo · pubblicato il {d} · presenti {p}.":"Écrit par {s} pour la table · publié le {d} · {p} présents.","Scarica il PDF":"Télécharger le PDF","La proposta consegnata":"La proposition remise","depositata il {d}":"déposée le {d}","Parte {n}":"Partie {n}","Scritta da {s} soggetti in {t} tavoli e {i} incontri. Ogni rendiconto è nell’Agorà.":"Écrite par {s} collectifs, en {t} tables et {i} rencontres. Chaque compte rendu est dans l’Agora.","Anteprima della mappa con il segnaposto dell’incontro":"Aperçu de la carte avec le repère de la rencontre","Sulla mappa l’incontro porta l’icona e il colore della sua istanza. Nell’app si apre la mappa di {c}, centrata sull’incontro.":"Sur la carte, la rencontre porte l’icône et la couleur de son instance. Dans l’appli, la carte de {c} s’ouvre, centrée sur la rencontre.","Tutto pronto, iscrizioni in arrivo":"Tout est prêt, les inscriptions arrivent","Progetti e Agorà partiranno quando potremo accogliere chi vi partecipa. Intanto puoi vedere com’è fatto tutto: le bacheche dei progetti, le persone che ci tengono, i tavoli delle istanze, gli eventi sulla mappa.":"Projets et Agora démarreront quand nous pourrons accueillir celles et ceux qui y participent. En attendant, tu peux voir comment tout est fait : les tableaux des projets, les personnes qui y tiennent, les tables des instances, les événements sur la carte.","Le istanze sono quelle dell’app. Obiettivi, tavoli, soggetti e rendiconti sono d’esempio; ogni istanza è messa a un punto diverso del cammino, per vedere come appare dall’inizio alla fine.":"Les instances sont celles de l’appli. Objectifs, tables, collectifs et comptes rendus sont des exemples ; chaque instance est placée à un point différent du chemin, pour voir à quoi elle ressemble du début à la fin.","Vuoi proporre un tavolo? Scrivi a":"Tu veux proposer une table ? Écris à","Ancora":"Ancre","Fata":"Fée","Vorrebbe venire, cerca compagnia":"Aimerait venir, cherche de la compagnie","Vorrebbe venire":"Aimerait venir","Tu":"Toi","Chi ci tiene":"Qui y tient","Le persone legate al progetto.":"Les personnes liées au projet.","Il bollino ti dice chi sono e a chi puoi scrivere.":"La pastille te dit qui elles sont et à qui tu peux écrire.","Le Ancore":"Les Ancres","Reggono il progetto. Scrivi a loro per organizzarti.":"Elles portent le projet. Écris-leur pour t’organiser.","Le Fate":"Les Fées","Ci tengono e ci sono spesso. Puoi scrivere a loro per sapere com’è, prima di venire.":"Elles y tiennent et sont souvent là. Tu peux leur écrire pour savoir comment c’est, avant de venir.","Vorrebbero venire il {d}":"Aimeraient venir le {d}","Solo chi ha scelto di farlo sapere. Con il bollino, chi cerca qualcuno con cui andare.":"Seulement celles et ceux qui ont choisi de le faire savoir. Avec la pastille, celles et ceux qui cherchent quelqu’un avec qui y aller.","Ci sei anche tu":"Toi aussi, tu y es","Vorrei venire anch’io":"J’aimerais venir aussi","Tutti salvati":"Tous enregistrés","Mappa stilizzata con i luoghi già toccati dal progetto e quello del prossimo appuntamento":"Carte stylisée avec les lieux déjà touchés par le projet et celui du prochain rendez-vous","Tutti i progetti":"Tous les projets","Da {d}":"Depuis {d}","Il prossimo appuntamento · evento Pratica":"Le prochain rendez-vous · événement Pratique","Ecco cosa serve perché il {d} succeda.":"Voici ce qu’il faut pour que le {d} ait lieu.","1 posto ancora libero":"1 place encore libre","{n} posti ancora liberi":"{n} places encore libres","Coperto":"Couvert","Scrivi alle Ancore":"Écrire aux Ancres","Come funziona un progetto":"Comment marche un projet","Ogni appuntamento del progetto è un <strong>evento Pratica</strong> sulla mappa e porta il nome del progetto. Prima di ogni appuntamento la bacheca dice cosa serve. Qui non c’è una chat: per organizzarvi scrivete alle Ancore o alle Fate, e la conversazione resta nei vostri canali.":"Chaque rendez-vous du projet est un <strong>événement Pratique</strong> sur la carte et porte le nom du projet. Avant chaque rendez-vous, le tableau dit ce qu’il faut. Ici, pas de chat : pour vous organiser, écrivez aux Ancres ou aux Fées, et la conversation reste dans vos canaux.","Pratiche collettive nel tessuto urbano":"Pratiques collectives dans le tissu urbain","La produzione culturale non avviene dove viene riconosciuta. Avviene nei cortili, nei presidi, nelle assemblee informali. Questi progetti esistono indipendentemente da Agorapp: la piattaforma rende visibile ciò che era già in atto.":"La production culturelle n’a pas lieu là où elle est reconnue. Elle a lieu dans les cours, les rassemblements, les assemblées informelles. Ces projets existent indépendamment d’Agorapp : la plateforme rend visible ce qui était déjà en cours.","Cosa vogliono dire le etichette":"Ce que veulent dire les étiquettes","Cosa serve:":"Ce qu’il faut :","Prossimo appuntamento:":"Prochain rendez-vous :","Apri":"Ouvrir","Nessun progetto in questo strato.":"Aucun projet dans ce calque.","Carica altri {n}":"En charger {n} de plus","Hai visto tutto: 1 progetto.":"Tu as tout vu : 1 projet.","Hai visto tutto: {n} progetti.":"Tu as tout vu : {n} projets.","I progetti sono nell’ordine in cui sono arrivati, non di popolarità.":"Les projets sont dans l’ordre où ils sont arrivés, pas de popularité.","Proponi un nuovo progetto":"Proposer un nouveau projet","Qualcosa che esiste già o sta per partire, nel tuo quartiere":"Quelque chose qui existe déjà ou va démarrer, dans ton quartier","Il prossimo appuntamento":"Le prochain rendez-vous","Nessun appuntamento fissato per ora. Quando c’è, compare qui e sulla mappa.":"Aucun rendez-vous fixé pour l’instant. Quand il y en a un, il apparaît ici et sur la carte.","Quello che il progetto cerca adesso.":"Ce que le projet cherche en ce moment.","Cercasi":"On cherche","Ogni appuntamento del progetto è un <strong>evento Pratica</strong> sulla mappa e porta il nome del progetto. Prima di ogni appuntamento la bacheca dice cosa serve. Qui non c’è una chat: per organizzarvi scrivete alle Ancore, e la conversazione resta nei vostri canali.":"Chaque rendez-vous du projet est un <strong>événement Pratique</strong> sur la carte et porte le nom du projet. Avant chaque rendez-vous, le tableau dit ce qu’il faut. Ici, pas de chat : pour vous organiser, écrivez aux Ancres, et la conversation reste dans vos canaux.","Evento Pratica":"Événement Pratique","Anteprima della mappa con il segnaposto dell’evento Pratica":"Aperçu de la carte avec le repère de l’événement Pratique","Il segnaposto dell’evento Pratica ha il doppio cerchio, e il popup porta alla bacheca del progetto. Il civico compare dal giorno prima, con il consenso del condominio. A ogni appuntamento il segnaposto si sposta sul cortile che ospita.":"Le repère de l’événement Pratique a un double cercle, et la fenêtre mène au tableau du projet. Le numéro de rue apparaît la veille, avec l’accord de la copropriété. À chaque rendez-vous, le repère se déplace vers la cour qui accueille.","Cosa vuoi salvare?":"Qu’est-ce que tu veux enregistrer ?","Solo il {d}":"Seulement le {d}","Tutti gli appuntamenti del progetto":"Tous les rendez-vous du projet","Compaiono nel calendario man mano che vengono fissati":"Ils apparaissent dans le calendrier au fur et à mesure qu’ils sont fixés","Togli dal calendario":"Retirer du calendrier","Se un appuntamento viene annullato, lo vedi quando riapri il calendario: Agorapp non manda notifiche. Si elimina come gli altri eventi ricorrenti: solo questo giorno o tutta la serie.":"Si un rendez-vous est annulé, tu le vois en rouvrant le calendrier : Agorapp n’envoie pas de notifications. Il se supprime comme les autres événements récurrents : seulement ce jour-là ou toute la série.","Collettivo":"Collectif","Persona":"Personne","Ancora da {d}":"Ancre depuis {d}","Fata da {d}":"Fée depuis {d}","Vorrebbe venire {d}":"Aimerait venir {d}","Nel progetto":"Dans le projet","Cerca qualcuno con cui andare":"Cherche quelqu’un avec qui y aller","Scrivi per andarci insieme":"Écrire pour y aller ensemble","Scrivi per allearti":"Écrire pour s’allier","Il recapito che ha scelto di rendere pubblico":"Le contact que cette personne a choisi de rendre public","email o telefono":"e-mail ou téléphone","Ha scelto di farsi vedere, ma non di essere contattato.":"A choisi d’être visible, mais pas d’être contacté.","Il profilo mostra solo ciò che ha fatto apparire nel progetto: niente seguaci, niente contatori.":"Le profil montre seulement ce qui a été rendu visible dans le projet : pas d’abonnés, pas de compteurs.","Fammi vedere tra chi vorrebbe venire":"Me montrer parmi les personnes qui aimeraient venir","Il tuo nome compare nella bacheca fino all’appuntamento, poi sparisce.":"Ton nom apparaît sur le tableau jusqu’au rendez-vous, puis disparaît.","Cerco qualcuno con cui andare":"Je cherche quelqu’un avec qui y aller","Accanto al tuo nome compare il bollino. Chi vuole può scriverti.":"La pastille apparaît à côté de ton nom. Qui veut peut t’écrire.","Anteprima: con le iscrizioni aperte servirà un profilo. Qui puoi provare come apparirebbe.":"Aperçu : quand les inscriptions seront ouvertes, il faudra un profil. Ici, tu peux essayer à quoi il ressemblerait.","La bacheca stampata":"Le tableau imprimé","Le Ancore: {n}, [recapito]. Questa bacheca è anche su Agorapp, sezione Progetti.":"Les Ancres : {n}, [contact]. Ce tableau est aussi sur Agorapp, section Projets.","Nell’app si scarica in PDF, come il PDF della giornata. Così il progetto arriva anche a chi non usa lo smartphone e non è nei gruppi di chat.":"Dans l’appli, il se télécharge en PDF, comme le PDF de la journée. Comme ça, le projet arrive aussi à qui n’utilise pas de smartphone et n’est pas dans les groupes de discussion.","I progetti in elenco sono quelli dell’app. Date, persone e cortili del Cortile Comune sono d’esempio.":"Les projets de la liste sont ceux de l’appli. Les dates, les personnes et les cours du Cortile Comune sont des exemples.","Vuoi portare il tuo progetto? Scrivi a":"Tu veux apporter ton projet ? Écris à","Con le iscrizioni aperte si apre il tuo programma di posta, con il recapito già scritto. Agorapp non ha una chat.":"Quand les inscriptions seront ouvertes, ta messagerie s’ouvrira avec le contact déjà rempli. Agorapp n’a pas de chat.","{n} caratteri · almeno {m}":"{n} caractères · au moins {m}","Progetti · proposta":"Projets · proposition","Un progetto è qualcosa che esiste già o sta per partire: un cortile aperto, un coro, una sartoria. Agorapp lo rende visibile, non lo gestisce.":"Un projet, c’est quelque chose qui existe déjà ou va démarrer : une cour ouverte, une chorale, un atelier de couture. Agorapp le rend visible, il ne le gère pas.","Agorà · proposta":"Agora · proposition","Un’istanza è un’ipotesi di trasformazione con un obiettivo comune. Si apre con un primo tavolo: soggetti che si incontrano di persona e scrivono una parte della proposta.":"Une instance est une hypothèse de transformation avec un objectif commun. Elle s’ouvre avec une première table : des collectifs qui se retrouvent en personne et écrivent une partie de la proposition.","Stiamo lavorando alla ricezione delle proposte: è prevista per la prima metà del 2027. Per ora il modulo è un’anteprima: non invia e non salva niente.":"Nous travaillons à la réception des propositions : elle est prévue pour le premier semestre 2027. Pour l’instant, le formulaire est un aperçu : il n’envoie et n’enregistre rien.","Come si chiama":"Comment ça s’appelle","es. Il Cortile Comune":"ex. Il Cortile Comune","Dove":"Où","quartiere o zona":"quartier ou zone","es. Crocetta, oppure Tutta la città":"ex. Crocetta, ou Toute la ville","Cosa fa":"Ce qu’il fait","Racconta il progetto: cosa succede, ogni quanto, per chi.":"Raconte le projet : ce qui se passe, à quelle fréquence, pour qui.","uno o più":"un ou plusieurs","fino a 3":"jusqu’à 3","Cosa serve adesso":"Ce qu’il faut maintenant","es. un cortile, mani per la merenda, sedie":"ex. une cour, des mains pour le goûter, des chaises","Come vuoi esserci":"Comment tu veux y être","Indipendente: il progetto fa tutto da sé. Accompagnato: Agorapp aiuta a partire, poi si fa da parte.":"Indépendant : le projet fait tout seul. Accompagné : Agorapp aide à démarrer, puis se met en retrait.","Chi lo regge":"Qui le porte","una persona di riferimento, un’Ancora":"une personne de référence, une Ancre","Nome, anche solo di battesimo":"Nom, même juste le prénom","Dove risponderti":"Où te répondre","nome@esempio.it":"nom@exemple.fr","es. Diritto abitativo":"ex. Droit au logement","Cosa vuole cambiare":"Ce qu’elle veut changer","La tensione da cui nasce e cosa dovrebbe cambiare.":"La tension d’où elle naît et ce qui devrait changer.","L’obiettivo, in una frase":"L’objectif, en une phrase","tutti i tavoli lavoreranno per questo":"toutes les tables travailleront pour ça","es. Nuove regole urbane per gli affitti":"ex. De nouvelles règles urbaines pour les loyers","Il primo tavolo: da quale parte cominciare":"La première table : par quelle partie commencer","es. un tetto agli affitti, zona per zona":"ex. un plafond des loyers, zone par zone","Chi propone":"Qui propose","il soggetto che si siede al primo tavolo":"le collectif qui s’assoit à la première table","es. Assemblea inquilini Vanchiglia":"ex. Assemblée des locataires de Vanchiglia","In che città":"Dans quelle ville","es. Torino":"ex. Turin","Agorapp non ha una chat: la redazione ti risponderà per email. L’indirizzo servirà solo per questa proposta.":"Agorapp n’a pas de chat : la rédaction te répondra par e-mail. L’adresse ne servira que pour cette proposition.","Prova a inviare":"Essayer d’envoyer","Il modulo funziona così":"Voici comment marche le formulaire","«{t}» è scritta, ma per ora non parte: la ricezione delle proposte è prevista per la prima metà del 2027. Allora arriverà alla redazione di Agorapp, che ti scriverà all’indirizzo che hai dato.":"« {t} » est écrite, mais pour l’instant elle ne pa tti i progetti":"كل المشاريع","Da {d}":"منذ {d}","Il prossimo appuntamento · evento Pratica":"الموعد القادم · فعالية ممارسة","Ecco cosa serve perché il {d} succeda.":"هذا ما يلزم كي يتحقق موعد {d}.","1 posto ancora libero":"مكان واحد ما زال شاغرًا","{n} posti ancora liberi":"{n} أماكن ما زالت شاغرة","Coperto":"تم توفيره","Scrivi alle Ancore":"اكتب إلى المراسي","Come funziona un progetto":"كيف يعمل المشروع","Ogni appuntamento del progetto è un <strong>evento Pratica</strong> sulla mappa e porta il nome del progetto. Prima di ogni appuntamento la bacheca dice cosa serve. Qui non c’è una chat: per organizzarvi scrivete alle Ancore o alle Fate, e la conversazione resta nei vostri canali.":"كل موعد من مواعيد المشروع هو <strong>فعالية ممارسة</strong> على الخريطة ويحمل اسم المشروع. قبل كل موعد، تقول اللوحة ما الذي يلزم. لا توجد هنا دردشة: لتنظيم أموركم اكتبوا إلى المراسي أو الجنيات، وتبقى المحادثة في قنواتكم.","Pratiche collettive nel tessuto urbano":"ممارسات جماعية في النسيج الحضري","La produzione culturale non avviene dove viene riconosciuta. Avviene nei cortili, nei presidi, nelle assemblee informali. Questi progetti esistono indipendentemente da Agorapp: la piattaforma rende visibile ciò che era già in atto.":"الإنتاج الثقافي لا يحدث حيث يُعترف به. إنه يحدث في الأفنية، وفي الاعتصامات، وفي الاجتماعات غير الرسمية. هذه المشاريع موجودة بمعزل عن Agorapp: المنصة تجعل مرئيًا ما كان قائمًا بالفعل.","Cosa vogliono dire le etichette":"ماذا تعني التسميات","Cosa serve:":"ما يلزم:","Prossimo appuntamento:":"الموعد القادم:","Apri":"افتح","Nessun progetto in questo strato.":"لا مشاريع في هذه الطبقة.","Carica altri {n}":"تحميل {n} أخرى","Hai visto tutto: 1 progetto.":"رأيت كل شيء: مشروع واحد.","Hai visto tutto: {n} progetti.":"رأيت كل شيء: {n} مشاريع.","I progetti sono nell’ordine in cui sono arrivati, non di popolarità.":"المشاريع مرتبة حسب ترتيب وصولها، لا حسب شعبيتها.","Proponi un nuovo progetto":"اقترح مشروعًا جديدًا","Qualcosa che esiste già o sta per partire, nel tuo quartiere": /* ---------- Mappa vera: CARTO vettoriale con MapLibre, tinta con i colori carta ---------- */
const STILE_CARTO = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
const PALETTE = {
  light:{terra:'#ECE6D9', terra2:'#E5DECF', strada:'#FBF8F1', bordo:'#D9CFBD', edificio:'#E0D8C8', acqua:'#C9DCE4', acquaT:'#5E7E8A', parco:'#D2E2C8', testo:'#5C5246', alone:'#F3EEE4', confine:'#A89F90', ferrovia:'#CFC6B4'},
  dark:{terra:'#1C1915', terra2:'#211D18', strada:'#36302A', bordo:'#2A251F', edificio:'#28231D', acqua:'#1D2E36', acquaT:'#86A9B5', parco:'#1F2C1E', testo:'#B5A998', alone:'#16130F', confine:'#6A6054', ferrovia:'#3A342C'}
};
const temaAttuale = () => document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
let map = null, mappaOk = false;
function sp(id, p, v){ try{ map.setPaintProperty(id, p, v); }catch(e){} }
function tingi(){
  if(!map) return; let stile; try{ stile = map.getStyle(); }catch(e){ return; } if(!stile || !stile.layers) return;
  const C = PALETTE[temaAttuale()];
  stile.layers.forEach(l => {
    const id = l.id, k = id.toLowerCase(); if(k.startsWith('agr-')) return;
    if(l.type==='background') return sp(id,'background-color',C.terra);
    if(l.type==='fill'){
      if(/water|ocean|sea|lake|river/.test(k)) return sp(id,'fill-color',C.acqua);
      if(/park|wood|grass|forest|nature|cemetery|garden|green|pitch|landcover|golf|recreation/.test(k)) return sp(id,'fill-color',C.parco);
      if(/building/.test(k)){ sp(id,'fill-color',C.edificio); return sp(id,'fill-outline-color',C.bordo); }
      if(/aeroway|runway|taxiway/.test(k)) return sp(id,'fill-color',C.terra2);
      return sp(id,'fill-color',C.terra2);
    }
    if(l.type==='fill-extrusion') return sp(id,'fill-extrusion-color',C.edificio);
    if(l.type==='line'){
      if(/water|river|stream|canal|ditch|drain/.test(k)) return sp(id,'line-color',C.acqua);
      if(/boundary|admin|border/.test(k)) return sp(id,'line-color',C.confine);
      if(/rail|train|tram|transit/.test(k)) return sp(id,'line-color',C.ferrovia);
      if(/case|casing|outline/.test(k)) return sp(id,'line-color',C.bordo);
      if(/road|street|motorway|trunk|primary|secondary|tertiary|minor|service|path|bridge|tunnel|highway|track|aeroway|pedestrian|footway|cycle/.test(k)) return sp(id,'line-color',C.strada);
      return;
    }
    if(l.type==='symbol'){
      const acq = /water|ocean|sea|lake|river|marine/.test(k);
      sp(id,'text-color', acq ? C.acquaT : C.testo); sp(id,'text-halo-color', C.alone); sp(id,'text-halo-width', 1.2);
      if(/poi|icon|shield/.test(k)) sp(id,'icon-opacity', .55);
    }
  });
}

function quartieriVuoti(lista){ return QUARTIERI.filter(q => !lista.some(e => e.lat>=q.la[0] && e.lat<q.la[1] && e.lng>=q.ln[0] && e.lng<q.ln[1])); }
function immagineTratteggio(){
  const s = 12, c = document.createElement('canvas'); c.width = c.height = s*2; const g = c.getContext('2d');
  g.strokeStyle = temaAttuale()==='dark' ? 'rgba(242,235,224,.30)' : 'rgba(92,82,70,.32)'; g.lineWidth = 2;
  for(let k=-s*2;k<=s*2;k+=s){ g.beginPath(); g.moveTo(k,0); g.lineTo(k+s*2,s*2); g.stroke(); }
  return g.getImageData(0,0,s*2,s*2);
}
function disegnaVuoti(lista){
  if(!map || !mappaOk) return;
  const src = map.getSource('agr-vuoti'); if(!src) return;
  const vuoti = vuotiAttivi() && !modoGiornata() ? quartieriVuoti(lista) : [];
  src.setData({type:'FeatureCollection', features:vuoti.map(q => ({type:'Feature', properties:{}, geometry:{type:'Polygon', coordinates:[[[q.ln[0],q.la[0]],[q.ln[1],q.la[0]],[q.ln[1],q.la[1]],[q.ln[0],q.la[1]],[q.ln[0],q.la[0]]]]}}))});
  const vt = etichettaTempo().vuoto;
  vuoti.forEach(q => mettiSegnaposto(`<span class="vuoto-lbl"><b>${esc(q.n)}</b><span>${esc(vt)}</span></span>`, (q.ln[0]+q.ln[1])/2, (q.la[0]+q.la[1])/2, 'mk-lbl mk-vuoto'));
}
function aggiungiLivelli(){

    map.addLayer({id:'agr-vuoti', type:'fill', source:'agr-vuoti', paint:{'fill-pattern':'agr-tratteggio', 'fill-opacity':.9}});

    map.addSource('agr-percorso', {type:'geojson', data:{type:'FeatureCollection', features:[]}});

function aggiornaZoomBtn(){ if(!map) return; const z = map.getZoom(); $('zPiu').disabled = z >= map.getMaxZoom()-0.01; $('zMeno').disabled = z <= map.getMinZoom()+0.01; }

/* pressione lunga sulla mappa = nuovo Off-Grid in quel punto */
let lungo = null, ultimaLunga = 0;
function annullaLungo(){ if(lungo){ clearTimeout(lungo.t1); clearTimeout(lungo.t2); if(lungo.segno) lungo.segno.remove(); lungo = null; } }
function installaLunga(){
  const can = map.getCanvasContainer(), area = $('area');
  $('map').addEventListener('contextmenu', e => e.preventDefault());
  can.addEventListener('touchstart', ev => {
    annullaLungo();
    if(ev.touches.length!==1 || st.posa || (ev.target.closest && ev.target.closest('.mk'))) return;
    const t = ev.touches[0], r = area.getBoundingClientRect(), x = t.clientX - r.left, y = t.clientY - r.top;
    const L = lungo = {x0:t.clientX, y0:t.clientY};
    L.t1 = setTimeout(() => { const s = document.createElement('span'); s.className = 'pressione'; s.style.left = x+'px'; s.style.top = y+'px'; area.appendChild(s); L.segno = s; }, 150);
    L.t2 = setTimeout(() => {
      if(lungo!==L) return; annullaLungo();
      if(Date.now()-ultimaLunga < 1500) return; ultimaLunga = Date.now();
      const mr = $('map').getBoundingClientRect(), ll = map.unproject([t.clientX - mr.left, t.clientY - mr.top]);
      apriFormPunto({lat:ll.lat, lng:ll.lng});
    }, 650);
  }, {passive:true});
  can.addEventListener('touchmove', ev => { if(!lungo) return; const t = ev.touches[0]; if(ev.touches.length>1 || Math.hypot(t.clientX-lungo.x0, t.clientY-lungo.y0) > 8) annullaLungo(); }, {passive:true});
  ['touchend','touchcancel'].forEach(n => can.addEventListener(n, annullaLungo, {passive:true}));
}

/* ---------- Segnaposto ---------- */
let segnaposti = [];
function pulisciSegnaposti(){ segnaposti.forEach(m => m.remove()); segnaposti = []; }
function mettiSegnaposto(html, lng, lat, cls){
  const el = document.createElement('div'); el.className = 'mk'+(cls?' '+cls:''); el.innerHTML = html;
  const m = new maplibregl.Marker({element:el, anchor:'center'}).setLngLat([lng,lat]).addTo(map);
  segnaposti.push(m); return m;
}
function raggruppa(lista){
  const R = 30, g = [];
  lista.forEach(e => {
    const p = map.project([e.lng, e.lat]);
    if(e.id===st.sel){ g.push({p, el:[e], fisso:true}); return; }
    const x = g.find(q => !q.fisso && Math.hypot(q.p.x-p.x, q.p.y-p.y) < R);
    if(x){ x.el.push(e); const n = x.el.length; x.p = {x:(x.p.x*(n-1)+p.x)/n, y:(x.p.y*(n-1)+p.y)/n}; }
    else g.push({p, el:[e]});
  });
  return g;
}
const modoGiornata = () => st.foglio==='calendario' && st.cal.vista==='giornata';
function svuotaPercorso(){ try{ const s = map && map.getSource('agr-percorso'); if(s) s.setData({type:'FeatureCollection', features:[]}); }catch(e){} }
function dataBreve(e){ return (e.giorno===oggi() ? tr('oggi') : e.giorno===domani() ? tr('domani') : nomeGiorno(e.giorno)) + ' ' + tr('alle {o}',{o:e.inizio}); }
function disegnaPins(){
  if(!map || !mappaOk) return;
  pulisciSegnaposti();
  if(modoGiornata()){ disegnaGiornataMappa(); return; }
  svuotaPercorso();
  const n = ora(), lista = visibili();
  disegnaVuoti(lista);
  raggruppa(lista).forEach(g => {
    const ll = map.unproject([g.p.x, g.p.y]);
    if(g.el.length===1){
      const e = g.el[0], cls = {evento:'ev', pratica:'pr', istanza:'is', og:'og'}[e.tipo] + (e.tipo==='istanza' ? ' c-'+e.ist : '');
      const inCorso = e.a<=n && e.b>n, fin = finito(e);
      const h = `<button class="pin ${cls}${inCorso?' ora':''}${fin?' finito':''}${st.sel===e.id?' sel':''}" style="--pc:${colorePin(e)}" data-ev="${esc(e.id)}" aria-label="${esc(e.titolo+', '+dataBreve(e))}"><span class="f">${contenutoPin(e)}${inCal(e.id)&&e.tipo!=='og'?`<span class="salvato">${icoCalPieno}</span>`:''}${e.nascosto?`<span class="lucchetto">${icoLucchetto(9)}</span>`:''}</span></button>`;
      mettiSegnaposto(h, e.lng, e.lat, st.sel===e.id ? 'alto' : '');
    } else {
      const col = [...new Set(g.el.map(colorePin))], passo = 360/col.length;
      const anello = `conic-gradient(${col.map((c,k) => `${c} ${(k*passo).toFixed(1)}deg ${((k+1)*passo).toFixed(1)}deg`).join(',')})`;
      mettiSegnaposto(`<button class="pin gruppo" style="--anello:${anello}" data-gruppo="${esc(g.el.map(e=>e.id).join(','))}" aria-label="${esc(tr('{n} cose qui vicino',{n:g.el.length}))}"><span class="f"><span>${g.el.length}</span></span></button>`, ll.lng, ll.lat);
    }
  });
  if(st.tuQui) mettiSegnaposto(`<span class="tu-qui" aria-label="${esc(tr('Sei qui'))}"></span>`, st.tuQui.lng, st.tuQui.lat, 'mk-tu');
  if(st.cercaQui) mettiSegnaposto('<span class="cerca-qui"></span>', st.cercaQui.lng, st.cercaQui.lat, 'mk-q');
}

/* ---------- Inquadrare ---------- */
function bandaVisibile(){
  const sopra = $('sopra'), f = document.querySelector('#foglio-slot .foglio'), H = $('area').clientHeight;
  const alto = sopra.hidden ? 8 : sopra.offsetHeight + 16;
  const basso = f ? f.offsetTop : H - 80;
  return [alto, Math.max(alto+60, basso), H];
}
function inquadra(lat, lng, zoomMin){
  if(!map) return; const [alto, basso, H] = bandaVisibile();
  map.easeTo({center:[lng,lat], zoom:Math.max(map.getZoom(), zoomMin||14), padding:{top:alto, bottom:Math.max(0, H-basso), left:16, right:16}, duration:450});
}
function inquadraTutti(punti){
  if(!map || !punti.length) return;
  if(punti.length===1) return inquadra(punti[0].lat, punti[0].lng, 15);
  const [alto, basso, H] = bandaVisibile(); let b = new maplibregl.LngLatBounds();
  punti.forEach(p => b.extend([p.lng, p.lat]));
  map.fitBounds(b, {padding:{top:alto+30, bottom:Math.max(30, H-basso+30), left:50, right:50}, maxZoom:16, duration:450});
}
function vaiCitta(anima){
  const c = cittaObj(); if(!map) return;
  const pad = {top:0, bottom:0, left:0, right:0};
  if(c.bounds) map.fitBounds(c.bounds, {padding:40, duration:anima?800:0});
  else if(anima) map.flyTo({center:[c.center[1],c.center[0]], zoom:c.zoom, padding:pad, duration:900});
  else map.jumpTo({center:[c.center[1],c.center[0]], zoom:c.zoom, padding:pad});
}

function etichettaTempo(){
  const m = {tutto:[tr('Tutto in arrivo')], adesso:[tr('Adesso')], oggi:[tr('Oggi')], domani:[tr('Domani')], weekend:[tr('Questo weekend')]};
  const v = {tutto:tr('niente in arrivo'), adesso:tr('niente adesso'), oggi:tr('niente oggi'), domani:tr('niente domani'), weekend:tr('niente nel weekend')};
  if(st.tempo==='date') return {t:intervallo(), vuoto:tr('niente in quei giorni')};
  return {t:m[st.tempo][0], vuoto:v[st.tempo]};
}
function intervallo(){

/* ======================= Fogli ======================= */
let ultimoFoglio = null;
function apri(f, extra){ st.foglio = f; Object.assign(st, extra||{}); disegnaFoglio(); disegnaPins(); posizioni(); }
function chiudi(){ st.espanso = false; TM.foglio = null; TM.salva = null; st.foglio = null; st.sel = null; st.gruppo = null; st.form = null; st.aform = null; st.conferma = null; st.pdf = null; st.importa = null; disegnaFoglio(); disegnaPins(); posizioni(); disegnaChips(); }
function foglio(cls, testa, corpo){
  const esp = st.espanso;
  return `<section class="foglio vetro ${cls}${esp?' espanso':''}" role="dialog" aria-modal="false"><div class="testa-f"><button class="maniglia-btn" data-az="espandi-foglio" aria-expanded="${esp}" aria-label="${esc(esp ? tr('Riduci il pannello') : tr('Allarga il pannello'))}"><span class="maniglia" aria-hidden="true"></span></button>${testa}</div><div class="corpo">${corpo}</div></section>`;
}
/* il trattino: il pannello scorre su e giù. Tocco = allarga o riduce con un'animazione; trascinando segue il dito e si ferma dove è più vicino.
   Allargato perde la trasparenza; ridotto la riprende (regola del 4 ottobre). */
const ANIMA_MS = 280, CURVA = 'cubic-bezier(.2,.8,.2,1)';
const fAttuale = () => document.querySelector('#foglio-slot .foglio');
function hMassima(f){ return (f.offsetParent ? f.offsetParent.clientHeight : window.innerHeight) - 8; }
function hRidotta(f){
  const css = f.style.cssText, e = f.classList.contains('espanso');
  f.style.transition = 'none'; f.style.height = ''; f.style.maxHeight = ''; f.classList.remove('espanso');
  const h = f.getBoundingClientRect().height;
  if(e) f.classList.add('espanso'); f.style.cssText = css; return h;
}
function altezza(f, h){ f.style.height = h + 'px'; f.style.maxHeight = h + 'px'; }
function animaFoglio(f, da, a){
  f.style.animation = 'none'; f.style.transition = 'none'; altezza(f, da); void f.offsetHeight;
  f.style.transition = `height ${ANIMA_MS}ms ${CURVA}, max-height ${ANIMA_MS}ms ${CURVA}, background-color .2s`;
  altezza(f, a);
  clearTimeout(f._fine); f._fine = setTimeout(() => { f.style.transition = ''; f.style.height = ''; f.style.maxHeight = ''; }, ANIMA_MS + 40);
}
function segnaManiglia(f){
  const b = f.querySelector('.maniglia-btn'); if(!b) return;
  b.setAttribute('aria-expanded', st.espanso); b.setAttribute('aria-label', st.espanso ? tr('Riduci il pannello') : tr('Allarga il pannello'));
}
function espandiFoglio(v, daAltezza){
  const f = fAttuale(); if(!f) return;
  const verso = v==null ? !st.espanso : !!v;
  const da = daAltezza!=null ? daAltezza : f.getBoundingClientRect().height, rid = hRidotta(f), max = hMassima(f);
  st.espanso = verso; f.classList.toggle('espanso', verso); segnaManiglia(f);
  animaFoglio(f, da, verso ? max : rid);
}
/* trascinamento: il pannello segue il dito */
const presa = {y:null, f:null, h0:0, min:0, max:0, mosso:false, quando:0};
function presaGiu(ev){
  const b = ev.target.closest && ev.target.closest('.maniglia-btn'); if(!b) return;
  const f = b.closest('.foglio'); if(!f) return;
  Object.assign(presa, {y:ev.clientY, f, h0:f.getBoundingClientRect().height, min:hRidotta(f), max:hMassima(f), mosso:false});
}
function presaMuovi(ev){
  if(presa.y==null) return;
  const dy = ev.clientY - presa.y; if(!presa.mosso && Math.abs(dy) < 6) return;
  presa.mosso = true; const f = presa.f;
  f.style.animation = 'none'; f.style.transition = 'none';
  altezza(f, Math.max(presa.min, Math.min(presa.max, presa.h0 - dy)));
}
function presaSu(){
  if(presa.y==null) return; presa.y = null;
  if(!presa.mosso) return;
  presa.quando = Date.now();
  const f = presa.f, h = f.getBoundingClientRect().height, corsa = Math.max(1, presa.max - presa.min);
  /* basta un quarto di corsa per cambiare stato */
  const verso = st.espanso ? (presa.max - h) < corsa*0.25 : (h - presa.min) > corsa*0.25;
  espandiFoglio(verso, h);
}
const chiudiBtn = az => `<button class="chiudi" data-az="${az||'chiudi'}" aria-label="${esc(tr('Chiudi'))}">${croce}</button>`;
function disegnaFoglio(){

    scheda:() => fScheda(byId(st.sel)), cerca:fCerca, date:fDate, calendario:fCalendario, pdf:fPdf, form:fForm, aform:fAdminForm, conferma:fConferma,
    condividi:fCondividi, pacchetto:fPacchetto, formula:fFormula, fate:fFateArrivo,

    html:() => foglio('forte alto', `<div class="riga-titolo"><div></div>${chiudiBtn()}</div>`, `<div class="${esc(st.fScope)}">${st.fHtml}</div>`)
  };
  const fn = F[st.foglio]; if(!fn){ st.foglio = null; slot.innerHTML = ''; return; }
  slot.innerHTML = fn();
  if(stesso){ const f = slot.querySelector('.foglio'); if(f) f.style.animation = 'none'; const c = slot.querySelector('.corpo'); if(c) c.scrollTop = scroll; }
  if(st.foglio==='cerca' && !stesso){ const i = $('q'); if(i) setTimeout(() => i.focus(), 60); }

/* ======================= Calendario: Giornata · Mese · Agenda (OG 1.3–1.4) ======================= */
const MEZZI = {piedi:{l:'a piedi', v:4.8, att:0}, bici:{l:'in bici', v:14, att:2}, mezzi:{l:'con i mezzi', v:16, att:8}};
function distKm(a,b){ const R = 6371, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLn = (b.lng-a.lng)*r; const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2; return 2*R*Math.asin(Math.sqrt(h))*1.4; }
function minuti(k, m){ const M = MEZZI[m]; return k<0.05 ? 0 : Math.max(1, Math.round(M.att + k/M.v*60)); }
function giornata(g){
  const tutte = miei().filter(e => e.giorno===g).sort((a,b) => a.a-b.a);
  const vive = tutte.filter(e => !sparito(e));
  const tratti = vive.slice(1).map((t,i) => {
    const p = vive[i], k = distKm(p,t), min = minuti(k, st.cal.mezzo);
    const parte = p.b>p.a ? p.b.getTime() : p.a.getTime()+36e5, arriva = parte + min*6e4, margine = Math.round((t.a - arriva)/6e4);
    const sovrapp = t.a.getTime() < parte;
    const alt = Object.keys(MEZZI).filter(m => m!==st.cal.mezzo).map(m => ({m, min:minuti(k,m)})).filter(x => parte + x.min*6e4 <= t.a.getTime());
    const libero = (t.a.getTime() - min*6e4) - parte;
    const stato = sovrapp ? 'sovrapp' : margine < 0 ? 'stretto' : libero >= 36e5 ? 'buco' : 'ok';
    return {k, min, margine, arriva, parte, libero, alt, stato, da:p, a:t};
  });
  return {tutte, vive, tratti};
}
function disegnaGiornataMappa(){
  const d = giornata(st.cal.giorno), feats = [];
  d.tratti.forEach(t => {
    feats.push({type:'Feature', properties:{c: t.stato==='stretto'||t.stato==='sovrapp' ? '#B4541C' : (temaAttuale()==='dark'?'#86B795':'#2D5A3D')}, geometry:{type:'LineString', coordinates:[[t.da.lng,t.da.lat],[t.a.lng,t.a.lat]]}});
    const etich = t.stato==='sovrapp' ? tr('si sovrappone') : durata(t.min) + (t.stato==='stretto' ? ' · '+tr('stretto') : '');
    mettiSegnaposto(`<span class="tratto-lbl ${t.stato==='stretto'?'stretto':t.stato==='sovrapp'?'sovrapp':''}">${esc(etich)}</span>`, (t.da.lng+t.a.lng)/2, (t.da.lat+t.a.lat)/2, 'mk-lbl');
  });
  try{ const s = map.getSource('agr-percorso'); if(s) s.setData({type:'FeatureCollection', features:feats}); }catch(e){}
  d.vive.forEach((t,i) => mettiSegnaposto(`<button class="tappa${t.tipo==='og'?' og':''}" style="--pc:${colorePin(t)}" data-ev="${esc(t.id)}" aria-label="${esc(tr('Tappa {n}: {t}',{n:i+1,t:t.titolo}))}">${i+1}</button>`, t.lng, t.lat, 'mk-tappa alto'));
}
function rigaTappa(t, i){

function vGiornata(){

    ${d.tutte.length?`<div class="lista" style="padding:4px 0">${lista}</div>${d.vive.length>1?`<p class="meta">${tr('Tempi stimati in linea d’aria per 1,4: non tengono conto di traffico e orari dei mezzi. La mappa sopra mostra il percorso numerato.')}</p>`:''}<button class="tasto pri pieno" data-aggiungi="${g}|">${tr('+ Aggiungi un Off-Grid')}</button>`
      :`<div class="fatti"><div class="dato">${icoCal()}<div><span class="t">${tr('Niente in questo giorno')}</span><span class="meta">${tr('Salva un evento dalla mappa o aggiungi un tuo Off-Grid.')}</span></div></div></div><button class="tasto pri pieno" data-aggiungi="${g}|">${tr('+ Aggiungi un Off-Grid')}</button>`}`;

function vMese(){

const URL_JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

function scaricaBlob(blob, nome){ const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }

const WINANSI = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
const pulisci = t => String(t==null?'':t).replace(/[\u2009\u202F\u00A0]/g,' ').replace(/[\u2010-\u2012]/g,'-').split('').filter(c => c.charCodeAt(0) < 256 || WINANSI.includes(c)).join('');
function creaPdf(scelti){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  const titolo = st.pdf.giornata ? tr('La mia giornata') : tr('Il mio calendario');
  const sotto = st.pdf.giornata ? maiusc(titoloGiorno(st.pdf.giornata)) : tr('Dal {d}',{d:dIso(oggi()).toLocaleDateString(dloc(),{day:'numeric',month:'long'})});
  const X = 16, W = 178, COL = 34; let y = 18;
  const riga = (t, font, stile, size, col, x, w) => { doc.setFont(font, stile); doc.setFontSize(size); doc.setTextColor(col); const l = doc.splitTextToSize(pulisci(t), w); doc.text(l, x, y); return l.length * size * 0.42; };
  const spazio = h => { if(y + h > 282){ doc.addPage(); y = 18; } };
  riga('AGORAPP · ' + cittaObj().n.toUpperCase(), 'helvetica', 'bold', 8, '#5C5246', X, W); y += 8;
  y += riga(titolo, 'times', 'bold', 22, '#1C1712', X, W) + 1;
  y += riga(sotto, 'helvetica', 'normal', 11, '#5C5246', X, W) + 4;
  const giorni = [...new Set(scelti.map(e => e.giorno))];
  giorni.forEach(g => {
    if(!st.pdf.giornata){ spazio(16); y += 3; doc.setDrawColor('#D8CFC2'); doc.line(X, y - 4, X + W, y - 4); y += riga(maiusc(titoloGiorno(g)).toUpperCase(), 'helvetica', 'bold', 8.5, '#5C5246', X, W) + 2; }
    scelti.filter(e => e.giorno===g).forEach(e => {
      const extra = [e.luogo, sottotitoloEv(e) + (e.prezzo ? ' · ' + formatPrice(e.prezzo) : '')].filter(Boolean).join('\n');
      doc.setFontSize(9.5); const hExtra = doc.splitTextToSize(pulisci(extra), W - COL).length * 4 + (e.tipo==='og' && e.desc ? doc.splitTextToSize(pulisci(e.desc), W - COL).length * 4 : 0);
      spazio(8 + hExtra);
      const y0 = y; riga(e.inizio + (e.fine ? '–' + e.fine : ''), 'helvetica', 'bold', 11, '#2F5D46', X, COL - 2);
      y += riga(e.titolo, 'helvetica', 'bold', 11, '#1C1712', X + COL, W - COL) + 0.5;
      if(extra) y += riga(extra, 'helvetica', 'normal', 9.5, '#5C5246', X + COL, W - COL);
      if(e.tipo==='og' && e.desc) y += riga(e.desc, 'helvetica', 'italic', 9.5, '#5C5246', X + COL, W - COL);
      y = Math.max(y, y0 + 6) + 4;
    });
  });
  spazio(12); doc.setDrawColor('#D8CFC2'); doc.line(X, y, X + W, y); y += 5;
  riga(tr('Stampato da Agorapp. Verifica orari e luoghi con chi organizza.'), 'helvetica', 'normal', 8.5, '#5C5246', X, W);
  return doc.output('blob');
}
/* «Condividi o scarica»: sul telefono si apre il foglio delle app (WhatsApp, posta…); altrimenti il file si scarica */
async function condividiPdf(){
  const scelti = basePdf().filter(e => !st.pdf.tolti.has(e.id)); if(!scelti.length) return;
  if(lang==='ar') return stampaPdf();   /* i font standard del PDF non hanno l'arabo: si stampa dal browser */
  try{ await preparaPdf(); }catch(e){ return stampaPdf(); }
  let blob; try{ blob = creaPdf(scelti); }catch(e){ return stampaPdf(); }
  const nome = (st.pdf.giornata ? 'agorapp-giornata-' + st.pdf.giornata : 'agorapp-calendario-' + oggi()) + '.pdf';
  const file = typeof File==='function' ? new File([blob], nome, {type:'application/pdf'}) : null;
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:nome}); }catch(e){ if(e && e.name!=='AbortError') scaricaBlob(blob, nome); }
  } else scaricaBlob(blob, nome);
}
function stampaPdf(){
  const scelti = basePdf().filter(e => !st.pdf.tolti.has(e.id)); if(!scelti.length) return;
  const titolo = st.pdf.giornata ? tr('La mia giornata') : tr('Il mio calendario');
  const sotto = st.pdf.giornata ? maiusc(titoloGiorno(st.pdf.giornata)) : '';
  const giorni = [...new Set(scelti.map(e => e.giorno))];
  const righe = giorni.map(g => `<tr><td colspan="3" class="day">${esc(maiusc(titoloGiorno(g)))}</td></tr>` + scelti.filter(e => e.giorno===g).map(e =>

  const html = `<!DOCTYPE html><html lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>${esc(titolo)} · Agorapp</title><style>body{font-family:Georgia,serif;max-width:760px;margin:24px auto;color:#1c1712;padding:0 16px}h1{font-size:24px;margin:0 0 2px;font-weight:400}p{font-size:12px;color:#5c5246;margin:0 0 18px;font-family:Helvetica,Arial,sans-serif}.m{text-transform:uppercase;letter-spacing:.08em;font-size:11px}table{width:100%;border-collapse:collapse;font-family:Helvetica,Arial,sans-serif}td{padding:8px 10px;border-bottom:1px solid #e3ddd0;font-size:12px;vertical-align:top}td.day{background:#f5f0e8;font-weight:700;font-size:13px;border-top:2px solid #cfc6b4}td.tm{white-space:nowrap;color:#5c5246;font-weight:700}td.tt{font-weight:600}.nt{font-weight:400;color:#5c5246;font-size:11px;margin-top:2px;white-space:pre-wrap}.f{margin-top:18px;font-size:11px;color:#5c5246;font-family:Helvetica,Arial,sans-serif}</style></head><body><p class="m">Agorapp · ${esc(cittaObj().n)}</p><h1>${esc(titolo)}</h1><p>${esc(sotto)}</p><table><tbody>${righe}</tbody></table><p class="f">${tr('Stampato da Agorapp. Verifica orari e luoghi con chi organizza.')}</p></body></html>`;
  const url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  const w = window.open(url, '_blank');
  if(w){ setTimeout(() => { try{ w.print(); }catch(e){} }, 700); setTimeout(() => URL.revokeObjectURL(url), 60000); }
  else { const a = document.createElement('a'); a.href = url; a.download = 'agorapp-calendario.html'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000); }
}


/* ======================= Indirizzi (OG 1.1–1.2: Photon mentre scrivi, Nominatim una volta per il civico) ======================= */
const cacheGeo = {};
let _nomiUltimo = 0;
function nomiGate(){ const w = Math.max(0, _nomiUltimo + 1100 - Date.now()); _nomiUltimo = Date.now() + w; return new Promise(r => setTimeout(r, w)); }
function getJ(u, sig){
  if(cacheGeo[u]) return Promise.resolve(cacheGeo[u]);
  const go = u.indexOf('nominatim.openstreetmap.org')>=0 ? nomiGate() : Promise.resolve();
  return go.then(() => fetch(u, {signal:sig, headers:{'Accept-Language':'it'}})).then(r => { if(!r.ok) throw 0; return r.json(); }).then(j => { cacheGeo[u] = j; return j; });
}
function centro(){ try{ const c = map.getCenter(); return {lat:c.lat, lng:c.lng, z:Math.round(map.getZoom())}; }catch(e){ const c = cittaObj(); return {lat:(c.center||[45.07])[0], lng:(c.center||[0,7.69])[1], z:12}; } }
function vbox(){ try{ const b = map.getBounds(); return '&viewbox='+encodeURIComponent(b.getWest()+','+b.getNorth()+','+b.getEast()+','+b.getSouth()); }catch(e){ return ''; } }
const norm = x => (x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function parseAddr(q){
  const parts = q.split(',').map(x => x.trim()).filter(Boolean);
  const first = (parts[0]||'').replace(/\b(n\.?|n°|nr\.?|civico)\s*(?=\d)/ig,'');
  let num = '', street = first, m;
  if((m = first.match(/^(.*?\D)\s+(\d+\s?[a-zA-Z]?(?:\/\s?[a-zA-Z0-9]+)?)$/))){ street = m[1].trim(); num = m[2].replace(/\s/g,''); }
  else if((m = first.match(/^(\d+[a-zA-Z]?)\s+(.+)$/))){ num = m[1]; street = m[2]; }
  let rest = parts.slice(1);
  if(!num && rest.length && /^\d+\s?[a-zA-Z]?(\/[a-zA-Z0-9]+)?$/.test(rest[0])){ num = rest[0].replace(/\s/g,''); rest = rest.slice(1); }
  const city = rest.join(', ').replace(/\b\d{5}\b/g,'').replace(/\(\s*[A-Z]{2}\s*\)|\b[A-Z]{2}\b$/g,'').replace(/\s{2,}/g,' ').replace(/^[\s,]+|[\s,]+$/g,'');
  return {street, num, city};
}
const provOf = a => { const m = ((a && a['ISO3166-2-lvl6'])||'').match(/^IT-([A-Z]{2})$/); return m ? m[1] : ''; };
function fullLine(r){
  const l1 = r.street ? (r.street + (r.hn ? ' '+r.hn : '')) : '';
  const l2 = ((r.postcode ? r.postcode+' ' : '') + (r.city||'')).trim() + (r.prov ? ' ('+r.prov+')' : '');
  return [l1, l2].filter(Boolean).join(', ');
}
function fromPhoton(f){
  const p = f.properties||{}, g = f.geometry && f.geometry.coordinates; if(!g) return null;
  const type = p.type||'', isStreet = type==='street' || p.osm_key==='highway' || (p.osm_key==='place' && p.osm_value==='square');
  const r = {lat:g[1], lng:g[0], name:'', street:p.street||'', hn:p.housenumber||'', postcode:p.postcode||'', city:p.city||p.town||p.village||p.locality||'', prov:'', county:p.county||''};
  if(isStreet){ r.street = r.street || p.name || ''; r.kind = 'street'; }
  else if(['city','town','village','locality','district','county','state'].includes(type)){ r.kind = 'place'; r.name = p.name||''; }
  else if(p.name){ r.kind = 'poi'; r.name = p.name; }
  else r.kind = 'house';
  return r;
}
function fromNomi(d){
  const a = d.address||{}, street = a.road||a.pedestrian||a.square||a.footway||a.path||'';
  const r = {lat:+d.lat, lng:+d.lon, name:'', street, hn:a.house_number||'', postcode:a.postcode||'', city:a.city||a.town||a.village||a.municipality||'', prov:provOf(a), county:a.county||''};
  const cls = d.class||'', typ = d.type||'';
  if(r.hn && (cls==='place'&&typ==='house' || cls==='building' || !d.name)) r.kind = 'house';
  else if(cls==='highway' || typ==='square') r.kind = 'street';
  else if(cls==='place' || cls==='boundary') r.kind = 'place';
  else { r.kind = 'poi'; r.name = d.name || (d.display_name||'').split(',')[0]; }
  return r;
}
function photon(q, sig){ const c = centro();
  return getJ('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=8&lat='+c.lat.toFixed(4)+'&lon='+c.lng.toFixed(4)+'&zoom='+c.z+'&bbox=6.6,36.6,18.6,47.1', sig)
    .then(j => (j.features||[]).map(fromPhoton).filter(Boolean)).catch(() => []); }
function nomiStructured(pa, sig){
  if(!pa.num || !pa.street) return Promise.resolve([]);
  let u = 'https://nominatim.openstreetmap.org/search?street='+encodeURIComponent(pa.num+' '+pa.street)+(pa.city?'&city='+encodeURIComponent(pa.city):'')+'&countrycodes=it&format=json&addressdetails=1&limit=4';
  if(!pa.city) u += vbox();
  return getJ(u, sig).then(d => (d||[]).map(fromNomi)).catch(() => []);
}
function nomiFree(q, sig){ return getJ('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&addressdetails=1&limit=5&countrycodes=it'+vbox(), sig).then(d => (d||[]).map(fromNomi)).catch(() => []); }
const streetMatches = (r, pa) => { const a = norm(pa.street), b = norm(r.street||r.name); return !!a && !!b && (a===b || b.indexOf(a)>=0 || a.indexOf(b)>=0); };
const cityMatches = (r, pa) => { if(!pa.city) return true; const a = norm(pa.city), b = norm(r.city); return !b || a===b || b.indexOf(a)>=0 || a.indexOf(b)>=0; };
function lookup(q, sig, preciso){
  const pa = parseAddr(q);
  return photon(q, sig).then(ph => {
    if(!preciso) return build(ph, pa);
    return nomiStructured(pa, sig).then(nm => { const all = nm.concat(ph); if(!all.length) return nomiFree(q, sig).then(r => build(r, pa)); return build(all, pa); });
  });
}
function build(all, pa){
  const out = [], seen = {};
  const push = r => { const k = (fullLine(r)+'|'+(r.name||'')).toLowerCase(); if(seen[k]) return; seen[k] = 1; out.push(r); };
  if(pa.num){
    const want = norm(pa.num);
    const exact = all.filter(r => r.hn && norm(r.hn)===want && streetMatches(r,pa) && cityMatches(r,pa));
    exact.forEach(r => { r.precision = 'exact'; push(r); });
    if(!exact.length){
      const st0 = all.filter(r => (r.kind==='street'||r.kind==='house'||r.street) && streetMatches(r,pa) && cityMatches(r,pa))[0];
      if(st0){ const syn = {lat:st0.lat, lng:st0.lng, name:'', street:st0.street||st0.name, hn:pa.num, postcode:st0.postcode, city:st0.city||pa.city, prov:st0.prov, kind:'street', precision:'street'};
        const near = all.filter(r => r.hn && streetMatches(r,pa) && cityMatches(r,pa)).sort((a,b) => Math.abs(parseInt(a.hn)-parseInt(pa.num)) - Math.abs(parseInt(b.hn)-parseInt(pa.num)))[0];
        if(near){ syn.lat = near.lat; syn.lng = near.lng; syn.postcode = syn.postcode || near.postcode; }
        push(syn); }
    }
  }
  all.forEach(r => { if(!r.precision) r.precision = r.hn ? 'exact' : (r.kind==='poi' ? 'exact' : 'nonum'); push(r); });
  return {list:out.slice(0,7), pa};
}
function reverseGeo(p){ return getJ('https://nominatim.openstreetmap.org/reverse?lat='+p.lat.toFixed(6)+'&lon='+p.lng.toFixed(6)+'&format=json&zoom=18&addressdetails=1')
  .then(d => { if(!d || !d.address) return ''; return fullLine(fromNomi(d)) || (d.display_name||'').split(',').slice(0,3).join(','); }).catch(() => ''); }
const testoRisultato = r => { const full = fullLine(r); return (r.kind==='poi' && r.name) ? (r.name + (full ? ', '+full : '')) : (full || r.name || r.city || ''); };
function htmlRisultato(r){
  const full = fullLine(r);
  if(r.kind==='poi' && r.name) return `<div class="m">${esc(r.name)}</div>${full?`<div class="s">${esc(full)}</div>`:''}`;
  if(r.kind==='place') return `<div class="m">${esc(r.name||r.city)}</div><div class="s">${esc(r.county||'')}</div>`;
  return `<div class="m">${esc(full||r.name)}</div>${r.precision==='street'?`<div class="w">${tr('Civico non in mappa · punto sulla via')}</div>`:''}`;
}
/* suggerimenti condivisi da Cerca, form Off-Grid e form admin */
const sugg = {t:null, ctrl:null, lista:[], dove:null};
function chiediSuggerimenti(testo, dove, box){
  clearTimeout(sugg.t); testo = (testo||'').trim();
  if(testo.length<3){ sugg.lista = []; if($(box)) $(box).innerHTML = ''; return; }
  sugg.t = setTimeout(() => {
    if(sugg.ctrl) try{ sugg.ctrl.abort(); }catch(e){}
    sugg.ctrl = window.AbortController ? new AbortController() : null;
    lookup(testo, sugg.ctrl && sugg.ctrl.signal).then(res => {
      const el = $(box); if(!el) return; sugg.lista = res.list; sugg.dove = dove;
      if(dove==='cerca'){ el.innerHTML = res.list.length ? `<div class="giorno">${tr('Luoghi e indirizzi')}</div><div class="lista">${res.list.map((r,i) => `<button class="luogo-r" data-si="${i}">${icoLuogo}<div>${htmlRisultato(r)}</div>${freccia}</button>`).join('')}</div>` : ''; return; }
      const piede = (!res.pa.num && res.list.some(r => r.kind==='street')) ? `<div class="sugg-foot">${tr('Aggiungi il numero civico per un punto preciso')}</div>` : '';
      el.innerHTML = res.list.length ? `<div class="sugg">${res.list.map((r,i) => `<button data-si="${i}">${icoLuogo}<div style="flex:1;min-width:0">${htmlRisultato(r)}</div></button>`).join('')}${piede}</div>`
        : `<div class="sugg"><button disabled><div class="meta">${tr('Nessun risultato: prova solo via e città')}</div></button></div>`;
    }).catch(() => {});
  }, 300);
}

function fDate(){
  const g0 = dIso(oggi()), lun = new Date(g0); lun.setDate(g0.getDate() - ((g0.getDay()+6)%7));

/* Carica Demo: il file demo/agorapp-demo.json, con le date spostate di settimane intere vicino a oggi */
async function caricaDemo(){

  const sposta = s => { const t = s.indexOf('T'); const dd = t<0 ? s : s.slice(0,t); return piuGiorni(dd, giorni) + (t<0 ? '' : s.slice(t)); };

  events = events.concat(nuovi);
  (dd.calendario||[]).concat(dd.offgrid.map(e => e.id)).forEach(id => { calEvents[id] = true; });
  DEMO = {caricata:new Date().toISOString(), giorni, progetti:dd.progetti, istanze:dd.istanze, temi:dd.temi, collegamenti:dd.collegamenti};
  if(!LS.set('agorapp_demo', DEMO)) { /* se manca spazio, la demo resta per questa sessione */ }
  purgeExpired(); saveEvents(); saveCal(); ricostruisci();
  /* con la demo si vede qualcosa: se gli strati sono tutti spenti, si accendono */
  if(!st.strati.size){ LAYERS.forEach(l => st.strati.add(l.id)); st.preset = -1; salvaStrati(); }
  st.demoMsg = tr('Demo caricata: {n} eventi e {o} Off-Grid. Date spostate di {g} giorni.',{n:dd.eventi.length, o:dd.offgrid.length, g:giorni});

}

function fileExcel(fogli, nome){
  return caricaScript(URL_XLSX).then(() => {
    const wb = XLSX.utils.book_new();
    fogli.forEach(([n, righe, larg]) => {
      /* le date come numero di serie di Excel con formato gg/mm/aaaa: niente sorprese di fuso orario */
      const date = [];
      const r2 = righe.map((r, i) => r.map((c, j) => { if(c instanceof Date){ date.push([i, j]); return (Date.UTC(c.getFullYear(), c.getMonth(), c.getDate()) - Date.UTC(1899, 11, 30))/864e5; } return c; }));

      date.forEach(([i, j]) => { const c = ws[XLSX.utils.encode_cell({r:i, c:j})]; if(c){ c.t = 'n'; c.z = 'dd/mm/yyyy'; } });
      if(larg) ws['!cols'] = larg.map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ws, n); });
    XLSX.writeFile(wb, nome, {compression:true});
  });

/* mini mappa stilizzata: i punti con le forme della mappa, su un foglio carta (la mappa vera si apre col tasto) */
function miniMappa(lista){

  if(!TM.mappaOn) return `<button class="t-mappa-chiusa" data-tz="mappa-on">${ICT.occhio}<span>${tr('Mostra la mappa')} · <b>${tr('{n} punti',{n:pts.length})}</b></span></button>`;
  if(!pts.length) return '';
  const W = 340, H = 162, cosl = Math.cos(45*Math.PI/180);
  let la0 = Math.min(...pts.map(p => p.lat)), la1 = Math.max(...pts.map(p => p.lat)), ln0 = Math.min(...pts.map(p => p.lng)), ln1 = Math.max(...pts.map(p => p.lng));
  const cx = (ln0+ln1)/2, cy = (la0+la1)/2; let w = Math.max((ln1-ln0)*cosl, 0.01), h = Math.max(la1-la0, 0.006);
  if(w/h < W/H) w = h*W/H; else h = w*H/W; w *= 1.25; h *= 1.25;
  const X = ln => (((ln-cx)*cosl)/w + .5)*W, Y = la => (.5 - (la-cy)/h)*H;

  return `<div class="t-mappa"><button class="t-mappa-svg" data-tz="sulla-mappa" aria-label="${esc(tr('Apri questi {n} punti sulla mappa',{n:pts.length}))}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${fondo}<g>${segni}</g></svg></button>
    <span class="t-mappa-lbl">${tr('{n} sulla mappa',{n:pts.length})}${fuori?' · '+tr('{n} in altre città',{n:fuori}):''}</span>

}

   Si accende scrivendo la formula nella barra degli eventi nascosti (Cerca). Da quel momento:
   - nel Calendario il tasto «PDF» diventa solo l'icona condividi, dorata e scintillante; fa scegliere tra PDF e pacchetto;

/* ---------- Sigillo: JSON → compresso → AES-GCM → base64url ---------- */
const b64u = u8 => { let s = ''; for(let i=0; i<u8.length; i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const deb64u = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for(let i=0; i<b.length; i++) u[i] = b.charCodeAt(i); return u; };
let chiaveFate = null;
const chiaveSigillo = () => chiaveFate || (chiaveFate = crypto.subtle.importKey('raw', deb64u(FATE_CHIAVE), 'AES-GCM', false, ['encrypt','decrypt']));
const puoComprimere = () => typeof CompressionStream==='function' && typeof DecompressionStream==='function';
async function flusso(u8, comprimi){
  const cs = comprimi ? new CompressionStream('deflate-raw') : new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
async function sigilla(obj){
  let dati = new TextEncoder().encode(JSON.stringify(obj)), flag = 0;
  if(puoComprimere()){ try{ dati = await flusso(dati, true); flag = 1; }catch(e){} }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:new Uint8Array([1, flag])}, await chiaveSigillo(), dati));
  const out = new Uint8Array(14 + ct.length); out[0] = 1; out[1] = flag; out.set(iv, 2); out.set(ct, 14);
  return b64u(out);
}
async function apriSigillo(s){
  const u = deb64u(s); if(u.length < 31 || u[0]!==1) throw new Error('formato');
  const flag = u[1];
  let dati = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(2,14), additionalData:new Uint8Array([1, flag])}, await chiaveSigillo(), u.slice(14)));
  if(flag===1){ if(!puoComprimere()) throw new Error('browser'); dati = await flusso(dati, false); }
  return JSON.parse(new TextDecoder().decode(dati));
}
function contenutoPacchetto(){
  const io = fataIo(), scelti = [];
  gruppiPacchetto().forEach(g => { if(!st.pk.tolti.has(g.k)) g.v.forEach(e => scelti.push(e.raw)); });
  return {v:1, da:{i:io.id, n:io.nome}, c:new Date().toISOString(), e:scelti.map(x => {
    const o = {o:x.id, t:x.title||'', s:x.datetime||'', y:Math.round(+x.lat*1e6)/1e6, x:Math.round(+x.lng*1e6)/1e6};
    if(x.end) o.f = x.end;
    if(x.addressFull || x.address) o.a = x.addressFull || x.address;
    if(x.addrPrecision && x.addrPrecision!=='exact') o.p = x.addrPrecision;
    if(x.notes) o.n = x.notes;
    const l = (x.links && x.links.length ? x.links : (x.link ? [x.link] : [])).filter(Boolean); if(l.length) o.l = l;
    if(x.seriesId){ o.r = x.seriesId; if(x.rep) o.q = {f:x.rep.freq, u:x.rep.until}; }
    return o; })};
}
async function creaLinkPacchetto(){
